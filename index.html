<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:#1a0f08}
body.doodle{background:#d8ceb4;font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",sans-serif}
#wrap{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;z-index:3}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.panel{border-radius:14px;padding:5px 10px 6px}
.lbl{font-size:11px;letter-spacing:1px;font-weight:700}
#score{font-size:26px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
#best{font-size:11.5px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
#mid{text-align:center;flex:1;min-width:0;margin-top:2px}
#wave{font-size:17px;font-weight:900;padding:3px 0}
#stage{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.btn{pointer-events:auto;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-sizing:border-box}
#sty{font-size:11px;font-weight:900;height:30px;line-height:1}
#hpRow{display:flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:10px}
#hpBar{flex:1;display:flex;gap:3px;height:12px}
#hpBar i{flex:1;border-radius:3px;box-sizing:border-box}
#hpBar i.hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1.5);background:#fff}100%{}}
#combo{font-size:12.5px;min-width:64px;text-align:right;font-weight:900}
#banner{position:absolute;left:0;right:0;top:33%;text-align:center;pointer-events:none;z-index:3;opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s cubic-bezier(.2,1.6,.4,1);padding:0 18px}
#banner.show{opacity:1;transform:scale(1)}
#banner b{display:inline-block;font-size:28px;font-weight:900;padding:4px 16px;border-radius:14px}
#banner span{display:block;margin-top:8px;font-size:14px;font-weight:700;line-height:1.5}
#hint{position:absolute;left:14px;right:14px;text-align:center;pointer-events:none;z-index:3;transition:opacity .8s;font-size:14px;line-height:1.55;padding:8px 10px;border-radius:14px;font-weight:700}
#hint.off{opacity:0}
#over{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px}
#over.show{display:flex}
.card{width:100%;max-width:330px;text-align:center;border-radius:20px;padding:18px 16px 16px;box-sizing:border-box}
.card h2{margin:0;font-size:26px}
.card .why{font-size:13px;margin:6px 0 10px;font-weight:700}
.card .big{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}
.card .nb{display:inline-block;margin-left:6px;font-size:13px;border-radius:8px;padding:2px 7px;vertical-align:middle}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:12.5px}
.stats div{border-radius:10px;padding:6px}
.stats b{display:block;font-size:17px}
.rule{font-size:11.5px;line-height:1.6;text-align:left;border-radius:10px;padding:8px 10px;margin-bottom:12px}
#retry{width:100%;height:54px;border-radius:14px;font-size:20px;font-weight:900;font-family:inherit;touch-action:manipulation;cursor:pointer}
#retry:active,#pause button:active{transform:scale(.97)}
.bpair{display:flex;gap:6px}
.pzi{width:12px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor;box-sizing:border-box}
#pause{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:18px}
#pause.show{display:flex}
#pause .ltl{margin:12px 0 6px}
.langs{display:flex;gap:6px;margin-bottom:12px}
.langs button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer;touch-action:manipulation}
#pause .big1,#pause .big2{width:100%;height:50px;border-radius:14px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;touch-action:manipulation;margin-top:8px}
body.toon #pause{background:radial-gradient(#3a1a08cc,#140804ee)}
body.toon .langs button,body.toon #pause .big2{color:#5a3a1a;background:#fff6e0;border:2px solid #b88a50}
body.toon .langs button.on{color:#fff;background:linear-gradient(#ffb03a,#e8601a);border-color:#6a2a08}
body.toon #pause .big1{color:#fff;background:linear-gradient(#ffb03a,#e8601a);border:3px solid #6a2a08;box-shadow:0 4px 0 #6a2a08;text-shadow:0 2px 0 #8a3a08}
body.doodle #pause{background:#2b2b3880}
body.doodle .langs button,body.doodle #pause .big2{color:#2b2b38;background:#fff;border:2.5px solid #2b2b38;border-radius:12px 8px 13px 9px}
body.doodle .langs button.on{background:#ffe066;box-shadow:2px 2px 0 #2b2b38}
body.doodle #pause .big1{color:#2b2b38;background:#7ad35a;border:3px solid #2b2b38;box-shadow:4px 4px 0 #2b2b38;border-radius:16px 10px 18px 12px}

/* ---- 写实卡通 ---- */
body.toon .hg{color:#7dff8a}body.toon .hy{color:#ffd23a}body.toon .hr{color:#ffb070}
body.doodle .hg{color:#1e8a32}body.doodle .hy{color:#c06a00}body.doodle .hr{color:#d8302a}
body.toon .panel,body.toon #hpRow{background:linear-gradient(#4a2e1aee,#2a1a0eee);border:2px solid #c89a5a;box-shadow:0 3px 0 #1a0c04,inset 0 1px 0 #ffffff30}
body.toon .lbl{color:#e8c890}
body.toon #score{color:#fff4dc;text-shadow:0 2px 0 #6a3a10,0 0 8px #ff9a3a80}
body.toon #best{color:#ffd070}
body.toon #wave{color:#fff;text-shadow:0 2px 0 #6a3a10,0 0 6px #000}
body.toon #stage{color:#ffe0b0;text-shadow:0 1px 2px #000}
body.toon .btn{background:linear-gradient(#5a3a22,#3a2414);border:2px solid #c89a5a;color:#ffe8c0;box-shadow:0 3px 0 #1a0c04}
body.toon #hpBar i{background:#2a160a;border:1px solid #6a4426}
body.toon #hpBar i.on{background:linear-gradient(#fff2d0,#d8c090);border-color:#fff8e0;box-shadow:0 0 4px #ffe8a0}
body.toon #hpBar i.low{background:linear-gradient(#ff8a6a,#d82a1a);border-color:#ffc0b0}
body.toon #combo{color:#ffd23a;text-shadow:0 2px 0 #6a3a10}
body.toon #banner b{color:#fff;background:linear-gradient(#e86a2a,#b83a10);border:3px solid #ffd080;box-shadow:0 4px 0 #5a1a04;text-shadow:0 2px 0 #6a1a04}
body.toon #banner span{color:#fff4dc;text-shadow:0 2px 3px #000,0 0 8px #000}
body.toon #hint{color:#fff4dc;background:#2a160acc;border:2px solid #c89a5a}
body.toon #hint em{font-style:normal;color:#ffd23a}
body.toon #over{background:radial-gradient(#3a1a08cc,#140804ee)}
body.toon .card{background:linear-gradient(#f6e4c0,#e2c898);border:4px solid #6a4426;box-shadow:0 6px 0 #3a2210,0 0 40px #000}
body.toon .card h2{color:#b8301a;text-shadow:0 2px 0 #fff4dc}
body.toon .card .why{color:#6a3a1a}
body.toon .card .big{color:#3a1a08}
body.toon .card .lbl{color:#8a5a2a}
body.toon .nb{color:#fff;background:#e85a2a}
body.toon .stats{color:#6a4426}
body.toon .stats div{background:#fff6e0;border:1.5px solid #c8a070}
body.toon .stats b{color:#3a1a08}
body.toon .rule{color:#5a3a1a;background:#fff2d8;border:1.5px dashed #b88a50}
body.toon #retry{color:#fff;background:linear-gradient(#ffb03a,#e8601a);border:3px solid #6a2a08;box-shadow:0 4px 0 #6a2a08;text-shadow:0 2px 0 #8a3a08}

/* ---- 涂鸦 ---- */
body.doodle .panel,body.doodle #hpRow{background:#fffdf4;border:2.5px solid #2b2b38;border-radius:14px 10px 15px 9px;box-shadow:3px 3px 0 #2b2b38}
body.doodle .lbl{color:#5a5a6a}
body.doodle #score{color:#2b2b38}
body.doodle #best{color:#e8602a}
body.doodle #wave{color:#2b2b38;background:#ffe066;border:2.5px solid #2b2b38;border-radius:10px 14px 9px 15px;padding:2px 10px;display:inline-block;transform:rotate(-2deg);box-shadow:2px 2px 0 #2b2b38}
body.doodle #stage{color:#2b2b38;margin-top:4px;text-shadow:0 0 3px #fff,0 0 3px #fff}
body.doodle .btn{background:#fffdf4;border:2.5px solid #2b2b38;color:#2b2b38;box-shadow:2px 2px 0 #2b2b38;border-radius:12px 9px 13px 8px}
body.doodle #hpBar i{background:#fff;border:2px solid #2b2b38;border-radius:4px 2px 4px 3px}
body.doodle #hpBar i.on{background:#ff6a8a}
body.doodle #hpBar i.low{background:#ff3a2a}
body.doodle #combo{color:#e8302a}
body.doodle #banner b{color:#2b2b38;background:#fff6a8;border:3px solid #2b2b38;border-radius:18px 10px 20px 12px;box-shadow:4px 4px 0 #2b2b38;transform:rotate(-2deg)}
body.doodle #banner span{color:#2b2b38;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 8px #fff}
body.doodle #hint{color:#2b2b38;background:#fffdf4ee;border:2.5px dashed #2b2b38}
body.doodle #hint em{font-style:normal;color:#e8602a}
body.doodle #over{background:#2b2b3880}
body.doodle .card{background:#fffdf4;border:3px solid #2b2b38;border-radius:24px 14px 26px 16px;box-shadow:6px 6px 0 #2b2b38;color:#2b2b38;background-image:repeating-linear-gradient(transparent 0 23px,#9ac0e840 23px 24px)}
body.doodle .card h2{color:#e8302a}
body.doodle .card .big{color:#2b2b38}
body.doodle .nb{color:#2b2b38;background:#ffe066;border:2px solid #2b2b38}

body.doodle .rule{background:#fff6c8;border:2px dashed #2b2b38}

</head>
<body class="toon">
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row">
      <div class="panel"><div class="lbl" data-t="score">击退积分</div><div id="score">0</div><div id="best">最佳 0</div></div>

  </div></div>
</div>
<script>
(()=>{
'use strict';
/* ================= 基础 ================= */
const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('cv'),ctx=cv.getContext('2d');
let W=360,H=800,DPR=1,cx=180,hy=200,by=640,ty=720,U=72,safeT=0,safeB=0;
const ZMAX=10,D0=1.6,PMIN=D0/(ZMAX+D0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

const probe=document.createElement('div');
probe.style.cssText='position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.appendChild(probe);

function layout(){
  const vw=window.innerWidth,vh=window.innerHeight;
  W=Math.min(vw,Math.round(vh*0.62));H=vh;
  wrap.style.width=W+'px';
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const cs=getComputedStyle(probe);safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;
  cx=W/2;
  const hudB=safeT+80;
  hy=Math.max(hudB+34,H*0.25);
  ty=H-safeB-Math.max(58,H*0.075);
  by=ty-Math.max(58,H*0.075);
  U=Math.min(W*0.235,(by-hy)*0.22);
  $('hint').style.top=(by-Math.max(120,(by-hy)*0.32))+'px';
  if(SPR.base)buildSprites();
}
function proj(x,z){
  const p=D0/(Math.max(z,-0.6)+D0),q=(p-PMIN)/(1-PMIN);
  return{x:cx+x*W*0.5*(0.3+0.7*q),y:hy+(by-hy)*q,s:0.48+0.52*q,q};
}

/* ================= 发光贴图 ================= */
const glowCache={};
function glow(col){
  if(glowCache[col])return glowCache[col];
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');

function pathPoly(g,o,closed){g.beginPath();g.moveTo(o[0],o[1]);for(let i=2;i<o.length;i+=2)g.lineTo(o[i],o[i+1]);if(closed)g.closePath()}

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}

const SHINE={body:1,belly:1,armor:1,horn:1,bronze:1,amber:1,helmet:1,stone:1,bone:1,crate:1,wing:1,accent:1,claw:1,shirt:1,pack:1,rock:1,canvas:1,heal:1,charge:1,cloth:1};

function toonDraw(g,parts,pal,opt){
  opt=opt||{};const ow=opt.ow||3,r=rng(opt.seed||7);
  g.lineJoin='round';g.lineCap='round';
  // 外轮廓加粗
  g.strokeStyle=pal.ink;g.lineWidth=ow*2.1;
  for(const p of parts){if(p.k==='l'||p.r==='glint')continue;pathPoly(g,toPoly(p),true);g.stroke()}
  for(const p of parts){
    const col=pal[p.r]||'#ff00ff',o=toPoly(p);
    if(p.k==='l'){pathPoly(g,o,false);g.strokeStyle=pal.ink;g.lineWidth=p.w*ow*0.7;g.stroke();continue}
    pathPoly(g,o,true);
    if(p.r!=='glint'){g.strokeStyle=FLAT[p.r]?pal.ink:mixHex(pal.ink,col,0.25);g.lineWidth=ow*(p.r==='pupil'?0.5:0.85);g.stroke()}
    const bb=bbox(o);
    if(FLAT[p.r]||bb.h<3){g.fillStyle=col;g.fill();continue}
    const gr=g.createLinearGradient(0,bb.y,0,bb.y+bb.h);
    gr.addColorStop(0,shade(col,0.24));gr.addColorStop(0.5,col);gr.addColorStop(1,shade(col,-0.34));
    g.fillStyle=gr;g.fill();
    if(SHINE[p.r]&&bb.w>5){
      g.save();pathPoly(g,o,true);g.clip();
      const R=Math.max(bb.w,bb.h);
      const hl=g.createRadialGradient(bb.x+bb.w*0.34,bb.y+bb.h*0.24,0,bb.x+bb.w*0.34,bb.y+bb.h*0.24,R*0.62);
      hl.addColorStop(0,'rgba(255,255,255,0.42)');hl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=hl;g.fillRect(bb.x,bb.y,bb.w,bb.h);
      // 底部反光（环境光）

      g.fillStyle=rim;g.fillRect(bb.x,bb.y,bb.w,bb.h);

        g.fillStyle=shade(col,-0.28);g.globalAlpha=0.45;
        const n=Math.round(bb.w*bb.h/90);
        for(let i=0;i<n;i++){const x=bb.x+r()*bb.w,y=bb.y+bb.h*(0.15+r()*0.7),s=0.6+r()*1.6;g.beginPath();g.ellipse(x,y,s*1.3,s,0,0,PI2);g.fill()}

    }
  }
}
function doodleDraw(g,parts,pal,opt){

  g.lineJoin='round';g.lineCap='round';

function eBass(t,m,len,v,bright){

const CHORDS=[[57,60,64],[53,57,60],[52,55,60],[55,59,62]],ROOTS=[33,29,36,31];
// 电贝斯主旋律（step, midi, len）
const LEAD=[[0,45,2],[3,48,1],[4,52,2],[7,50,1],[8,48,2],[10,45,1],[12,43,2],[14,45,2],
[16,41,2],[19,45,1],[20,48,2],[23,45,1],[24,41,2],[26,43,1],[28,45,4],
[32,48,2],[35,52,1],[36,55,2],[39,52,1],[40,50,2],[42,48,1],[44,52,2],[46,55,2],
[48,50,2],[51,47,1],[52,43,2],[55,47,1],[56,50,3],[60,52,4]];
const leadAt={};for(const n of LEAD)leadAt[n[0]]=n;
function musicTick(){
  const a=AU.ctx;if(!a||a.state!=='running')return;
  const sd=60/108/4;
  while(AU.next<a.currentTime+0.15){
    const s=AU.step,t=AU.next,L=AU.over?0:AU.level,bar=s>>4,b=s&15;
    if(b===0)padChord(t,CHORDS[bar],sd*16,L>=4?0.03:0.024);
    if(L>=1){
      if(b%4===0)kick(t,L>=4?0.95:0.8);
      if(L<4&&b===14&&bar%2===1)kick(t,0.55);
      if(b%2===0)hat(t,0.06+(b%4===2?0.04:0));
    }
    if(L>=2&&(b===4||b===12))snare(t,0.42);
    if(L>=3){if(b%2===1)hat(t,0.035);if(b===14)hat(t,0.07,true)}
    if(L>=4&&bar===3&&b>=12)tom(t,48-(b-12)*3,0.45);
    if(L>=4&&s===0)hat(t,0.12,true);
    // 低音脉冲
    if(b%2===0)subBass(t,ROOTS[bar]+(L>=3&&b%4===2?12:0),sd*1.6,L===0?0.09:0.14);
    // 电贝斯主奏
    const n=leadAt[s];
    if(n&&(L>=2||b%4===0||L===0&&b===0)){eBass(t,n[1],n[2]*sd,L===0?0.12:0.2,L>=3);if(L>=4)eBass(t,n[1]+12,n[2]*sd,0.08,true)}
    // 琶音装饰
    if(L>=3){const ch=CHORDS[bar];pluck(t,ch[b%3]+24+(b%6>=3?12:0),0.035)}
    else if(L>=1&&b%8===6)pluck(t,CHORDS[bar][(bar+b)%3]+24,0.03);

  }
}
function sfx(kind,x){
  const a=AU.ctx;if(!a||a.state!=='running')return;const t=a.currentTime+0.005,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(AU.sfx);

    const n=noiseSrc(t,0.2),f=a.createBiquadFilter(),ng=a.createGain();f.type='lowpass';f.frequency.value=2200;env(ng,t,0.002,0.18,0.18);n.connect(f);f.connect(ng);ng.connect(AU.sfx)}
  else if(kind==='base'){o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+0.45);env(g,t,0.003,0.6,0.45);o.start(t);o.stop(t+0.5);
    const n=noiseSrc(t,0.4),f=a.createBiquadFilter(),ng=a.createGain();f.type='lowpass';f.frequency.value=600;env(ng,t,0.002,0.5,0.4);n.connect(f);f.connect(ng);ng.connect(AU.sfx)}

}

/* ================= 波次设计 ================= */
function stageOf(n){return n<=2?1:n<=4?2:n<=6?3:4}
function waveDef(n){
  const st=stageOf(n),k=Math.max(0,n-7);
  let c,gap,hpMul=1,supHp,supN;
  if(n===1){c={raptor:8};gap=1.5}
  else if(n===2){c={raptor:10};gap=1.35}
  else if(n===3){c={raptor:9,trike:2};gap=1.25}
  else if(n===4){c={raptor:11,trike:3};gap=1.2}
  else if(n===5){c={raptor:9,ptero:4,trike:2,ankylo:1};gap=1.05}
  else if(n===6){c={raptor:10,ptero:5,trike:3,ankylo:2};gap=1.0}
  else{c={raptor:10+k,ptero:5+(k>>1),trike:3+Math.floor(k/3),ankylo:Math.min(4,2+(k>>1))};gap=Math.max(0.55,0.92*Math.pow(0.96,k));hpMul=Math.pow(1.1,k)}
  supHp=[0,3,4,5,6][st];supN=[0,1,2,2,3][st];
  const boss=n>=8&&n%2===0;
  const r=rng(n*7919+13),list=[];
  const heavy=[],light=[];
  for(const t in c)for(let i=0;i<c[t];i++)(TYPES[t].heavy?heavy:light).push(t);
  for(let i=light.length-1;i>0;i--){const j=r()*(i+1)|0;[light[i],light[j]]=[light[j],light[i]]}
  // 重甲均匀插入，间隔至少 3 个
  const seq=light.slice(),step=Math.max(3,Math.floor((light.length+heavy.length)/(heavy.length+1)));
  heavy.forEach((h,i)=>seq.splice(Math.min(seq.length,(i+1)*step+i),0,h));
  let t=2.2,lastX=0;
  seq.forEach((type,i)=>{
    let x;do{x=(r()*1.6-0.8)*(TYPES[type].heavy?0.75:1)}while(Math.abs(x-lastX)<0.32);lastX=x;
    list.push({t,type,x});
    t+=gap*(TYPES[type].heavy?1.6:(0.8+r()*0.4))*(st>=2&&r()<0.25?0.45:1);
  });
  if(boss)list.push({t:t*0.42,type:'trex',x:0});
  list.sort((a,b)=>a.t-b.t);
  const sup=[];for(let i=0;i<supN;i++)sup.push({t:2+t*(i+0.5)/supN+(i?0:2),side:(n+i)%2?1:-1,z:3.6+r()*2.2});
  return{n,st,list,sup,hpMul,supHp,dur:t,boss};
}

    5:[tr('stage',3,tr('s3')),tr('tip5',TYPES.ankylo.hp)],7:[tr('stage',4,tr('s4')),tr('tip7')]};

function spawn(type,x,hpMul){

function killEnemy(e){
  const T=TYPES[e.type];
  const mult=Math.min(3,1+0.1*S.combo);
  const pts=Math.round(e.pts*mult);
  S.score+=pts;S.combo++;S.comboT=2.5;S.kills++;
  const big=T.boss?2.2:T.heavy?1.5:1;
  burst(e.sx,e.sy,T.col,Math.round(14*big),220*big,0.8,null,big*0.9);burst(e.sx,e.sy,'#fff',Math.round(4*big),200*big,1,'bone',big);
  burst(e.px,e.gy,'#c8a878',Math.round(6*big),60*big,0.7,'dust',big*2.2);ring(e.sx,e.sy,e.h*0.7);
  if(e.type==='supply')burst(e.sx,e.sy,e.kind==='heal'?'#5ad06a':'#ffd23a',14,260,0.9,'star',1.6);

    else{S.charge=6;addText(e.sx,e.sy-e.sr-24,tr('f_charge'),"#ffd447",20);S.heat=0;S.over=0}

/* ================= 更新 ================= */
function update(dt){
  S.t+=dt;
  if(S.stageFade<1)S.stageFade=Math.min(1,S.stageFade+dt/2);
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('show')}
  if(hintT>0){hintT-=dt*(S.firing?1.6:1);if(hintT<=0)$('hint').classList.add('off')}
  S.shake=Math.max(0,S.shake-dt*1.6);S.flash=Math.max(0,S.flash-dt);
  // 波次
  const wv=S.wv;
  if(!S.dead){
    S.wt+=dt;
    while(S.qi<wv.list.length&&S.wt>=wv.list[S.qi].t-(TYPES[wv.list[S.qi].type].heavy?1.6:0)){
      const it=wv.list[S.qi++];
      if(TYPES[it.type].heavy){S.tele.push({it,t:TYPES[it.type].boss?2.4:1.6,max:TYPES[it.type].boss?2.4:1.6});if(TYPES[it.type].boss){sfx('warn');banner(tr('bossT'),tr('bossS',Math.round(90*wv.hpMul)),2)}}
      else spawn(it.type,it.x,wv.hpMul);
    }
    for(const tl of S.tele){tl.t-=dt;if(tl.t<=0){spawn(tl.it.type,tl.it.x,wv.hpMul);tl.done=1}}
    S.tele=S.tele.filter(t=>!t.done);
    while(S.si<wv.sup.length&&S.wt>=wv.sup[S.si].t){spawnSupply(wv.sup[S.si++])}
    if(S.qi>=wv.list.length&&S.si>=wv.sup.length&&!S.tele.length&&!S.enemies.length){
      if(!S.inter){
        const bonus=50*S.wave+(S.noDmg?150:0);S.score+=bonus;S.inter=2.6;sfx('wave');
        banner(tr('cleared',S.wave),tr('clearB',50*S.wave)+(S.noDmg?tr('noDmg'):''),2.2);updHUD();
      }else{S.inter-=dt;if(S.inter<=0)startWave(S.wave+1)}
    }
  }
  // 连击
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0){S.combo=0;updHUD()}}
  // 敌人
  for(const e of S.enemies){
    e.t+=dt;e.flash=Math.max(0,e.flash-dt*6);e.hitT=Math.max(0,(e.hitT||0)-dt);
    if(e.type==='supply'){
      e.life-=dt;e.x+=e.dir*4.6/6*dt;
      if(e.life<=0||Math.abs(e.x)>2.4){e.gone=1;const p=proj(clamp(e.x,-1,1),e.z);addText(p.x,p.y-30,tr('f_esc'),"#ffd447",14);sfx('escape')}
    }else{
      e.z-=e.spd*dt;
      if(e.type==='ptero')e.x=e.x0*0.6+Math.sin(e.t*1.6+e.ph)*0.45;
      else if(e.type==='raptor')e.x=e.x0+Math.sin(e.t*2.2+e.ph)*0.06;
      if(e.z<=0&&!S.dead){e.gone=1;baseHit(e)}
    }
    const T=TYPES[e.type],p=proj(e.x,e.z),h=U*T.size*p.s;
    e.px=p.x;e.gy=p.y;e.py=p.y-(T.fly?h*0.35+Math.sin(e.t*3)*4:0);e.h=h;e.sx=p.x+(e.type==='supply'?-e.dir*h*0.05:0);e.sy=e.py-h*T.cy;e.sr=h*T.hr;e.q=p.q;
  }
  S.enemies=S.enemies.filter(e=>!e.gone&&!e.dead);
  // 瞄准吸附
  S.lockE=null;let bd=1e9;
  for(const e of S.enemies){const d=Math.hypot(e.sx-S.aim.x,e.sy-S.aim.y);if(d<e.sr+26&&d<bd){bd=d;S.lockE=e}}
  // 炮台
  const mx=cx,my=ty-8;
  const tx=S.lockE?S.lockE.sx:S.aim.x,tyy=S.lockE?S.lockE.sy:S.aim.y;
  S.turretA=Math.atan2(tyy-my,tx-mx);
  if(S.charge>0)S.charge-=dt;
  if(S.over>0){S.over-=dt;S.heat=Math.max(0,S.heat-dt*70);if(S.over<=0)S.heat=0}
  S.fireCD-=dt;S.rec=Math.max(0,S.rec-dt*14);
  if(S.firing&&!S.dead&&S.over<=0){
    S.heat=Math.max(0,S.heat-dt*12);
    if(S.fireCD<=0){
      const ch=S.charge>0;S.fireCD=ch?0.085:0.125;
      const n=ch?3:1;
      for(let i=0;i<n;i++){
        const a=S.turretA+(i-(n-1)/2)*0.07,bl=Math.hypot(tx-mx,tyy-my);
        S.bullets.push({x:mx+Math.cos(a)*MUZ(),y:my-2+Math.sin(a)*MUZ(),vx:Math.cos(a)*1500,vy:Math.sin(a)*1500,left:bl+50,col:ch?'#ffd23a':'#ff9a2a'});
      }
      if(!ch){S.heat+=6;if(S.heat>=100){S.heat=100;S.over=1.5;sfx('heat');addText(cx,ty-70,tr('f_heat'),'#ff7a3d',16)}}
      S.fired++;S.rec=1;sfx('shot');
    }
  }else S.heat=Math.max(0,S.heat-dt*45);
  // 子弹
  for(const b of S.bullets){
    const st=dt/3;
    for(let k=0;k<3&&!b.dead;k++){
      b.x+=b.vx*st;b.y+=b.vy*st;b.left-=1500*st;
      for(const e of S.enemies){
        if(e.dead)continue;const dx=b.x-e.sx,dy=b.y-e.sy;
        if(dx*dx+dy*dy<e.sr*e.sr){
          b.dead=1;e.hp-=1;e.flash=1;e.hitT=0.12;burst(b.x,b.y,TYPES[e.type].heavy?'#fff2c0':TYPES[e.type].col,3,140,0.3,TYPES[e.type].heavy?'star':null,0.8);
          if(e.hp<=0){e.dead=1;killEnemy(e)}else sfx('hit',TYPES[e.type].heavy?300:620);
          break;
        }
      }
      if(b.left<=0&&!b.dead){b.dead=1;burst(b.x,b.y,'#d8b888',2,40,0.35,'dust',1.2)}
    }
  }
  S.bullets=S.bullets.filter(b=>!b.dead);
  for(const p of S.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.98}
  S.parts=S.parts.filter(p=>p.t<p.life);
  for(const t of S.texts)t.t+=dt;S.texts=S.texts.filter(t=>t.t<1.1);
  // 装饰流星
  if(S.stage>=3&&Math.random()<dt*(S.stage===4?1.6:0.8))S.meteors.push({x:Math.random()*W*1.2,y:-10,v:300+Math.random()*300,t:0,s:2+Math.random()*3});
  if(S.dust.length<(S.stage===4?50:24))S.dust.push({x:Math.random()*W,y:hy+Math.random()*(H-hy),vx:(Math.random()-0.3)*14,vy:S.stage===4?-20-Math.random()*20:-4-Math.random()*6,s:0.8+Math.random()*1.8,a:0.2+Math.random()*0.5,t:0,l:3+Math.random()*4});
  for(const d of S.dust){d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt}S.dust=S.dust.filter(d=>d.t<d.l&&d.y>hy-20);
  for(const m of S.meteors){m.t+=dt;m.x-=m.v*0.55*dt;m.y+=m.v*dt}S.meteors=S.meteors.filter(m=>m.y<hy-10);
}

function drawEnemy(e){

    if(p.k==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*4);ctx.fillStyle=p.col;ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*0.45:p.s;ctx.lineTo(Math.cos(i*Math.PI/5)*r,Math.sin(i*Math.PI/5)*r)}ctx.closePath();ctx.fill();if(!toon){ctx.strokeStyle='#2b2b38';ctx.lineWidth=1.4;ctx.stroke()}ctx.restore();continue}
    const s=p.s*(0.5+a*0.5);
    if(toon){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,s,0,PI2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(p.x-s*0.3,p.y-s*0.3,s*0.4,0,PI2);ctx.fill()}
    else{ctx.fillStyle=p.col;ctx.fillRect(p.x-s,p.y-s,s*2,s*2);ctx.strokeStyle='#2b2b38';ctx.lineWidth=1;ctx.strokeRect(p.x-s,p.y-s,s*2,s*2)}
  }
  ctx.globalAlpha=1;
}
function drawBullets(){
  const toon=TH==='toon';
  for(const b of S.bullets){
    const ang=Math.atan2(b.vy,b.vx);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);
    if(toon){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.8;ctx.drawImage(glow(b.col),-14,-10,24,20);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      const g=ctx.createLinearGradient(-22,0,4,0);g.addColorStop(0,'rgba(255,180,60,0)');g.addColorStop(1,'rgba(255,230,160,0.9)');ctx.fillStyle=g;ctx.fillRect(-22,-1.6,24,3.2);
      ctx.fillStyle='#fff6d0';ctx.beginPath();ctx.ellipse(0,0,5,2.6,0,0,PI2);ctx.fill()}
    else{ctx.strokeStyle='#2b2b38';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-16,-3);ctx.lineTo(-8,-3);ctx.moveTo(-18,3);ctx.lineTo(-9,3);ctx.stroke();
      ctx.fillStyle=b.col;ctx.beginPath();ctx.ellipse(0,0,5.5,3.4,0,0,PI2);ctx.fill();ctx.stroke()}
    ctx.restore();
  }
}
function drawTexts(){
  for(const t of S.texts){
    const a=Math.min(1,(1.1-t.t)*2.2),y=t.y-t.t*42,sc=t.t<0.12?0.6+t.t/0.12*0.5:1.1-Math.min(0.1,(t.t-0.12));
    ctx.save();ctx.globalAlpha=a;ctx.translate(t.x,y);ctx.scale(sc,sc);
    ctx.font='900 '+t.size+'px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.lineWidth=TH==='toon'?5:4.5;ctx.strokeStyle=TH==='toon'?'#2a1406':'#ffffff';ctx.strokeText(t.s,0,0);
    ctx.fillStyle=TH==='toon'?t.col:shade(t.col,-0.25);ctx.fillText(t.s,0,0);
    if(TH!=='toon'){ctx.lineWidth=1.2;ctx.strokeStyle='#2b2b38';ctx.strokeText(t.s,0,0)}
    ctx.restore();
  }
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sh=S.shake*14;ctx.save();if(sh>0)ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);
  const f=S.stageFade;
  if(f<1){ctx.drawImage(bgFor(S.prevStage),0,0,W,H);ctx.globalAlpha=f}
  ctx.drawImage(bgFor(S.stage),0,0,W,H);ctx.globalAlpha=1;
  drawSceneFX(S.t);
  drawTele();
  const es=S.enemies.slice().sort((a,b)=>b.z-a.z);
  for(const e of es)drawShadow(e);
  for(const e of es)drawEnemy(e);
  drawFence();
  drawBullets();drawParts();
  drawTurret();drawAim();drawTexts();
  ctx.restore();
  if(S.flash>0){ctx.fillStyle='rgba(255,40,40,'+(S.flash*0.3)+')';ctx.fillRect(0,0,W,H)}
  if(S.hp<=4&&!S.dead){const v=ctx.createRadialGradient(cx,H/2,Math.min(W,H)*0.3,cx,H/2,Math.max(W,H)*0.7);v.addColorStop(0,'rgba(255,0,0,0)');v.addColorStop(1,'rgba(220,20,20,'+(0.2+0.12*Math.sin(S.t*6))+')');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
}

/* ================= 主循环 ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const ts=window.__ts||1;if(!paused)for(let i=0;i<ts;i++)update(dt);render();if(!paused)musicTick();
  requestAnimationFrame(frame);
}
layout();document.body.className=TH;applyLang();$('sty').textContent=TH==='toon'?tr('styDoodle'):tr('styToon');buildSprites();setMute(AU.muted);newGame();
requestAnimationFrame(frame);
// 测试钩子
window.__FT={setStyle,setLang,setPause,get paused(){return paused},get S(){return S},waveDef,skip(n){S.enemies=[];S.tele=[];startWave(n)},stageOf,TYPES,get AU(){return AU}};
})();
</script>
