<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>化石学家 · 固定炮台守卫</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:#1a0f08}
#wrap{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
/* HUD：右上角 112px 留给宿主 App 的胶囊按钮 */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none;z-index:3}
.row{display:flex;align-items:center;gap:6px;height:40px;padding-right:102px}
.panel{border-radius:12px}
#sp{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;box-sizing:border-box;min-width:0}
#score{font-size:22px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.btn{pointer-events:auto;width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box}
#hpRow{display:flex;align-items:center;gap:7px;margin-top:12px;padding:4px 8px;border-radius:10px}
#wave{font-size:13px;font-weight:900;white-space:nowrap}
#hpBar{flex:1;display:flex;gap:2px;height:10px;min-width:0}
#hpBar i{flex:1;border-radius:3px;box-sizing:border-box}
#hpBar i.hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1.5);background:#fff}100%{}}
#combo{font-size:12px;font-weight:900;white-space:nowrap}
#combo:empty{display:none}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:3;opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s cubic-bezier(.2,1.6,.4,1);padding:0 18px}
#banner.show{opacity:1;transform:scale(1)}
#banner b{display:inline-block;font-size:26px;font-weight:900;padding:4px 16px;border-radius:14px}
#banner>span{display:block;margin-top:8px;font-size:13.5px;font-weight:700;line-height:1.5}
#hint{position:absolute;left:14px;right:14px;text-align:center;pointer-events:none;z-index:3;transition:opacity .8s;font-size:13.5px;line-height:1.5;padding:7px 10px;border-radius:14px;font-weight:700}
#hint.off{opacity:0}
#over{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px}
#over.show{display:flex}
.card{width:100%;max-width:330px;text-align:center;border-radius:20px;padding:18px 16px 16px;box-sizing:border-box}
.card h2{margin:0;font-size:26px}
.card .why{font-size:13px;margin:6px 0 10px;font-weight:700}
.card .big{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}
.card .nb{display:inline-block;margin-left:6px;font-size:13px;border-radius:8px;padding:2px 7px;vertical-align:middle}
.lbl{font-size:11px;letter-spacing:1px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 12px;font-size:12.5px}
.stats div{border-radius:10px;padding:6px}
.stats b{display:block;font-size:17px}
.rule{font-size:11.5px;line-height:1.6;text-align:left;border-radius:10px;padding:8px 10px;margin-bottom:12px}
#retry{width:100%;height:54px;border-radius:14px;font-size:20px;font-weight:900;font-family:inherit;touch-action:manipulation;cursor:pointer}
#retry:active,#pause button:active{transform:scale(.97)}
.pzi{width:12px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor;box-sizing:border-box}
#pause{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:18px}
#pause.show{display:flex}
#pause .card{max-height:100%;overflow-y:auto;touch-action:pan-y}
#pause .ltl{margin:12px 0 6px}
.langs{display:flex;gap:6px;margin-bottom:12px}
.langs button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer;touch-action:manipulation}
.big1,.big2{width:100%;height:50px;border-radius:14px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;touch-action:manipulation;margin-top:8px}
.pair{display:flex;gap:8px}.pair button{flex:1}
#coin{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.ci{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#ffc23a 45%,#c88400);border:1.5px solid #6a4400;box-sizing:border-box;flex:none}
#coin.pop{animation:cpop .25s}
@keyframes cpop{50%{transform:scale(1.25)}}
/* 武器：屏幕下方左右两角的小按钮，拥有 2 把以上才显示 */
#wbar{position:absolute;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);display:flex;gap:6px;z-index:3;box-sizing:border-box;pointer-events:none}
#wbar.off{display:none}
#wbar .gap{flex:1}
.ws{width:50px;height:50px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;position:relative;box-sizing:border-box}
.ws img{height:72%;max-width:80%;object-fit:contain;pointer-events:none}
.ws .st{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:-1px;line-height:1}
.ws .k{position:absolute;top:2px;left:5px;font-size:9px;opacity:.55}
.ws.lock{visibility:hidden}
#shop{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:12px}
#shop.show{display:flex}
.scard{max-width:360px;padding:14px 12px 12px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 8px}
.scoin{display:flex;align-items:center;gap:5px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.scoin .ci{width:20px;height:20px}
.shead .lbl{font-size:10.5px;letter-spacing:0;text-align:right;line-height:1.3}
#offers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.of{border-radius:14px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:pointer;touch-action:manipulation;box-sizing:border-box;position:relative}
.of img{height:44px;max-width:90%;object-fit:contain}
.of .tg{position:absolute;top:5px;left:6px;font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:6px}
.of .on{font-size:13.5px;font-weight:900;line-height:1.15}
.of .od{font-size:10.5px;line-height:1.3;min-height:27px}
.of .op{margin-top:2px;width:100%;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:900}
.of.sold{opacity:.4;pointer-events:none}
.of.poor .op{opacity:.55}
#team{display:flex;gap:6px;justify-content:center;margin:8px 0 2px;min-height:20px;flex-wrap:wrap;font-size:11px;font-weight:700}
#team span{padding:2px 7px;border-radius:8px}
.srow{display:flex;gap:8px;margin-top:6px}
.srow button{margin-top:0!important;height:48px!important;font-size:16px!important}
.srow #reroll{flex:0 0 38%}
#reroll:disabled{opacity:.5}
.srow .ci{width:14px;height:14px;vertical-align:-2px}
#codex{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:12px}
#codex.show{display:flex}
#dexClose{position:sticky;bottom:0;box-shadow:0 -6px 10px rgba(0,0,0,.18)}
#codex .scard{padding-bottom:0}
#dexN{margin-top:4px;letter-spacing:0;font-size:10.5px}
#dexList{display:flex;flex-direction:column;gap:7px;margin:8px 0 2px;padding-bottom:4px;text-align:left}
.dx{display:flex;gap:8px;align-items:center;border-radius:12px;padding:6px 8px}
.dx img{width:60px;height:60px;object-fit:contain;flex:none}
.dx.unk img{filter:brightness(0);opacity:.35}
.dx2{min-width:0;flex:1}
.dx .dn{font-size:14px;font-weight:900}
.dtag{font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:6px;margin-left:6px;vertical-align:1px}
.dx .ds{font-size:10.5px;font-weight:700;margin:2px 0;display:flex;flex-wrap:wrap;gap:1px 8px}
.dx .dd{font-size:10.5px;line-height:1.35}
.dxe{border-radius:12px;padding:7px 9px;font-size:10.5px;line-height:1.45;text-align:left}
.dxe b{font-size:13px}

/* ---- 卡通主题 ---- */
#pause,#over,#shop{background:radial-gradient(#3a1a08cc,#140804ee)}
#codex{background:radial-gradient(#3a1a08cc,#140804f0)}
.langs button,.big2{color:#5a3a1a;background:#fff6e0;border:2px solid #b88a50}
.langs button.on{color:#fff;background:linear-gradient(#ffb03a,#e8601a);border-color:#6a2a08}
.big1,#retry{color:#fff;background:linear-gradient(#ffb03a,#e8601a);border:3px solid #6a2a08;box-shadow:0 4px 0 #6a2a08;text-shadow:0 2px 0 #8a3a08}
.dx{background:#fff6e0;border:2px solid #c8a070;color:#3a1a08}
.dx .ds{color:#8a5a2a}.dx .dd{color:#6a4426}
.dxe{background:linear-gradient(#fff2c0,#ffe08a);border:2px solid #c89a2a;color:#5a3a08}
.dtag{background:#6a4426;color:#ffe8c0}.dtag.boss{background:#d82a1a;color:#fff}.dtag.sup{background:#e8a800;color:#fff}
#coin{color:#ffe08a;text-shadow:0 1px 0 #6a3a10}
.ws{background:linear-gradient(#5a3a22,#2e1c0e);border:2px solid #8a6a3a;color:#ffd23a;box-shadow:0 3px 0 #1a0c04}
.ws.cur{border-color:#ffd23a;background:linear-gradient(#8a5a2a,#4a2a10);box-shadow:0 0 10px #ffb03a,0 3px 0 #1a0c04}
.ws .k{color:#ffe8c0}
.scoin{color:#6a3a08}
.shead .lbl{color:#8a5a2a}
.of{background:#fff6e0;border:2px solid #c8a070;box-shadow:0 3px 0 #b8905a;color:#3a1a08}
.of .od{color:#7a5a3a}
.of .op{background:linear-gradient(#ffb03a,#e8601a);color:#fff;text-shadow:0 1px 0 #8a3a08}
.of.poor .op{background:#b8a080}
.of .tg{background:#6a4426;color:#ffe8c0}
#team span{background:#6a4426;color:#ffe8c0}
.hg{color:#7dff8a}.hy{color:#ffd23a}.hr{color:#ffb070}
.panel,#hpRow{background:linear-gradient(#4a2e1aee,#2a1a0eee);border:2px solid #c89a5a;box-shadow:0 3px 0 #1a0c04,inset 0 1px 0 #ffffff30}
.lbl{color:#e8c890}
#score{color:#fff4dc;text-shadow:0 2px 0 #6a3a10,0 0 8px #ff9a3a80}
#wave{color:#ffd070;text-shadow:0 1px 0 #6a3a10}
.btn{background:linear-gradient(#5a3a22,#3a2414);border:2px solid #c89a5a;color:#ffe8c0;box-shadow:0 3px 0 #1a0c04}
#hpBar i{background:#2a160a;border:1px solid #6a4426}
#hpBar i.on{background:linear-gradient(#fff2d0,#d8c090);border-color:#fff8e0;box-shadow:0 0 4px #ffe8a0}
#hpBar i.low{background:linear-gradient(#ff8a6a,#d82a1a);border-color:#ffc0b0}
#combo{color:#ffd23a;text-shadow:0 2px 0 #6a3a10}
#banner b{color:#fff;background:linear-gradient(#e86a2a,#b83a10);border:3px solid #ffd080;box-shadow:0 4px 0 #5a1a04;text-shadow:0 2px 0 #6a1a04}
#banner span{color:#fff4dc;text-shadow:0 2px 3px #000,0 0 8px #000}
#hint{color:#fff4dc;background:#2a160acc;border:2px solid #c89a5a}
#hint em{font-style:normal;color:#ffd23a}
.card{background:linear-gradient(#f6e4c0,#e2c898);border:4px solid #6a4426;box-shadow:0 6px 0 #3a2210,0 0 40px #000}
.card h2{color:#b8301a;text-shadow:0 2px 0 #fff4dc}
.card .why{color:#6a3a1a}
.card .big{color:#3a1a08}
.card .lbl{color:#8a5a2a}
.nb{color:#fff;background:#e85a2a}
.stats{color:#6a4426}
.stats div{background:#fff6e0;border:1.5px solid #c8a070}
.stats b{color:#3a1a08}
.rule{color:#5a3a1a;background:#fff2d8;border:1.5px dashed #b88a50}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row">
      <div id="pz" class="btn" role="button" tabindex="0" aria-label="暂停"><i class="pzi"></i></div>
      <div id="sp" class="panel"><div id="score">0</div><div id="coin"><i class="ci"></i><b id="coinN">0</b></div></div>
    </div>
    <div id="hpRow"><span id="wave">第 1 波</span><div id="hpBar"></div><span id="combo"></span></div>
  </div>
  <div id="wbar" class="off"></div>
  <div id="banner"><b></b><span></span></div>
  <div id="hint" data-t="hint0"></div>
  <div id="over"><div class="card">
    <h2 data-t="over">骨栅失守</h2>
    <div class="why" id="why">基地生命值归零</div>
    <div class="lbl" data-t="final">本局击退积分</div>
    <div class="big"><span id="fScore">0</span><span class="nb" id="nb" style="display:none" data-t="newRec">新纪录</span></div>
    <div class="stats">
      <div><span data-t="stBest"></span><b id="fBest">0</b></div>
      <div><span data-t="stWave"></span><b id="fWave">1</b></div>
      <div><span data-t="stKill"></span><b id="fKill">0</b></div>
      <div><span data-t="stSup"></span><b id="fSup">0</b></div>
    </div>
    <button id="dexO" class="big2" data-t="dexT" style="margin:0 0 8px">怪物图鉴</button>
    <button id="retry" data-t="retry">再守一次</button>
  </div></div>
  <div id="shop"><div class="card scard">
    <h2 data-t="shopT">营地补给</h2>
    <div class="shead"><span class="scoin"><i class="ci"></i><b id="sCoin">0</b></span><span class="lbl" data-t="shopHint"></span></div>
    <div id="offers"></div>
    <div id="team"></div>
    <div class="srow"><button id="reroll" class="big2"></button><button id="go" class="big1"></button></div>
  </div></div>
  <div id="pause" role="dialog" aria-modal="true" aria-labelledby="pauseTitle"><div class="card">
    <h2 id="pauseTitle" data-t="pause">暂停</h2>
    <div class="lbl ltl" data-t="lang"></div>
    <div class="langs"><button data-lang="zh">简体中文</button><button data-lang="tw">繁體中文</button><button data-lang="en">English</button></div>
    <div class="rule" data-t="pauseRule"></div>
    <button id="resume" class="big1" data-t="resume">继续</button>
    <div class="pair"><button id="mute" class="big2">🔊</button><button id="dexP" class="big2" data-t="dexT">怪物图鉴</button></div>
    <button id="restart" class="big2" data-t="restart">重新开始</button>
  </div></div>
  <div id="codex"><div class="card scard">
    <h2 data-t="dexT">怪物图鉴</h2>
    <div class="lbl" id="dexN"></div>
    <div id="dexList"></div>
    <button id="dexClose" class="big1" data-t="close">返回</button>
  </div></div>
</div>

const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('cv'),ctx=cv.getContext('2d');
let W=360,H=800,DPR=1,cx=180,hy=200,by=640,ty=720,U=72,safeT=0,safeB=0;
const ZMAX=10,D0=1.6,PMIN=D0/(ZMAX+D0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const fmt=v=>v%1?v.toFixed(1):String(v);

const probe=document.createElement('div');
probe.style.cssText='position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.appendChild(probe);

function layout(){
  const vw=window.innerWidth,vh=window.innerHeight;
  W=Math.min(vw,Math.round(vh*0.62));H=vh;
  wrap.style.width=W+'px';
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const cs=getComputedStyle(probe);safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;
  cx=W/2;
  /* HUD：顶栏 40 + 骨栅条 ≈ safeT+86；武器按钮在底部两角，不再占整条 */
  const hudB=safeT+86;
  hy=Math.max(hudB+34,H*0.2);
  ty=H-safeB-Math.max(40,H*0.058);
  by=ty-Math.max(66,H*0.088);
  U=Math.min(W*0.235,(by-hy)*0.22);
  $('hint').style.top=(by-Math.max(120,(by-hy)*0.32))+'px';
  if(SPR.base){buildSprites();renderBar();if(S&&S.shop)renderShop()}
}
/* 队友站台离骨栅的高度 */
function AY(){return(ty-by)*0.62}
function proj(x,z){
  const p=D0/(Math.max(z,-0.6)+D0),q=(p-PMIN)/(1-PMIN);
  return{x:cx+x*W*0.5*(0.3+0.7*q),y:hy+(by-hy)*q,s:0.48+0.52*q,q};
}
/* 屏幕 y → 透视比例（爆炸半径用） */
function sAtY(y){const q=clamp((y-hy)/(by-hy),0,1);return 0.48+0.52*q}

const glowCache={};
function glow(col){
  if(glowCache[col])return glowCache[col];
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(0.18,col);gr.addColorStop(0.5,col+'55');gr.addColorStop(1,col+'00');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return glowCache[col]=c;
}

/* 生成 4 张商店卡片 */
function shopOffers(K,hp,r){
  const pool=[];
  for(const k of WKEYS){if(!K.w[k])pool.push({t:'buy',k,p:WEAPONS[k].price,wt:3});else if(K.w[k]<3)pool.push({t:'wup',k,p:WEAPONS[k].up[K.w[k]-1],wt:2.5})}
  if(K.allies.length<4)for(const a of AKEYS)pool.push({t:'hire',k:a,p:recruitPrice(K,a),wt:K.allies.length<2?2.4:1.4});
  K.allies.forEach((al,i)=>{if(al.lv<3)pool.push({t:'aup',k:al.k,i,p:ALLIES[al.k].up[al.lv-1],wt:1.6})});
  if(hp<HPMAX)pool.push({t:'fix',p:45,wt:hp<=5?4:1.4});
  if(K.cool<3)pool.push({t:'cool',p:80+K.cool*50,wt:1.2});
  const out=[];
  while(out.length<4&&pool.length){
    let s=0;for(const o of pool)s+=o.wt;let x=r()*s,j=0;
    for(;j<pool.length-1;j++){x-=pool[j].wt;if(x<=0)break}
    const o=pool.splice(j,1)[0];
    out.push(o);
    /* 一次最多两张招募卡 */
    if(out.filter(q=>q.t==='hire').length>=2)for(let i=pool.length-1;i>=0;i--)if(pool[i].t==='hire')pool.splice(i,1);
  }
  return out;
}

let LANG=(()=>{const q=/[?&]lang=(zh|tw|en)/.exec(location.search);if(q)return q[1];const s=store('fossil_lang');if(I18N[s])return s;
  const n=(window.FossilPlatform.locale()||navigator.language||'').toLowerCase();return n.startsWith('zh')?(/tw|hk|mo|hant/.test(n)?'tw':'zh'):'en'})();
const localeTags={zh:'zh-CN',tw:'zh-TW',en:'en'};
const text=window.FossilPlatform.createI18n({en:I18N.en,'zh-CN':I18N.zh,'zh-TW':I18N.tw});
function tr(k,...a){return text.t(k,Object.fromEntries(a.map((v,i)=>[String(i),v])))}
function applyLang(){
  text.setLocale(localeTags[LANG]);
  document.documentElement.lang=LANG==='zh'?'zh-CN':LANG==='tw'?'zh-TW':'en';document.title=tr('title');
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=tr(el.dataset.t)});
  document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.toggle('on',el.dataset.lang===LANG);el.setAttribute('aria-pressed',String(el.dataset.lang===LANG))});
  $('pz').setAttribute('aria-label',tr('pause'));
}

/* ================= 共享造型：部件几何（两种画风共用） =================
   设计坐标：脚底 y=0，向上为负；部件从后到前排列
   e 椭圆 / p 多边形(可平滑) / t 变宽曲线(腿/尾/角) / l 只描线；r = 颜色角色 */
const PI2=Math.PI*2;
function pe(x,y,rx,ry,r,rot){return{k:'e',x,y,rx,ry,r,rot:rot||0}}
function pp(pts,r,sm){return{k:'p',pts,r,sm:sm!==false}}
function pt(pts,w0,w1,r){return{k:'t',pts,w0,w1,r}}
function pl(pts,r,w){return{k:'l',pts,r,w:w||1}}
function shade(c,k){const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(k<0){r*=1+k;g*=1+k;b*=1+k}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}
  return'#'+((1<<24)+((r|0)<<16)+((g|0)<<8)+(b|0)).toString(16).slice(1)}
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const f=s=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t);return'#'+((1<<24)+(f(16)<<16)+(f(8)<<8)+f(0)).toString(16).slice(1)}
function crSample(pts,closed,seg){
  const n=pts.length/2,out=[];if(n<2)return pts.slice();
  const P=i=>{i=closed?(i+n)%n:Math.max(0,Math.min(n-1,i));return i*2};
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){
    const a=P(i-1),b=P(i),c=P(i+1),d=P(i+2);
    for(let s=0;s<seg;s++){const t=s/seg,t2=t*t,t3=t2*t;
      for(let k=0;k<2;k++){const p0=pts[a+k],p1=pts[b+k],p2=pts[c+k],p3=pts[d+k];
        out.push(0.5*(2*p1+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3))}}
  }
  if(!closed)out.push(pts[(n-1)*2],pts[(n-1)*2+1]);
  return out;
}
function toPoly(p){
  if(p.poly)return p.poly;let o;
  if(p.k==='e'){o=[];const N=Math.max(12,Math.min(30,Math.round((p.rx+p.ry)*1.3))),c=Math.cos(p.rot),s=Math.sin(p.rot);
    for(let i=0;i<N;i++){const a=i/N*PI2,x=Math.cos(a)*p.rx,y=Math.sin(a)*p.ry;o.push(p.x+x*c-y*s,p.y+x*s+y*c)}}
  else if(p.k==='p')o=p.sm?crSample(p.pts,true,5):p.pts.slice();
  else if(p.k==='l')o=p.pts.length>4?crSample(p.pts,false,6):p.pts.slice();
  else{const c=crSample(p.pts,false,6),n=c.length/2,L=[],R=[];let dx=0,dy=0,d0x=0,d0y=0;
    for(let i=0;i<n;i++){const i0=Math.max(0,i-1),i1=Math.min(n-1,i+1);dx=c[i1*2]-c[i0*2];dy=c[i1*2+1]-c[i0*2+1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;if(!i){d0x=dx;d0y=dy}
      const w=(p.w0+(p.w1-p.w0)*i/(n-1))/2;L.push(c[i*2]-dy*w,c[i*2+1]+dx*w);R.push(c[i*2]+dy*w,c[i*2+1]-dx*w)}
    o=L.slice();const e=(n-1)*2;o.push(c[e]+dx*p.w1*0.45,c[e+1]+dy*p.w1*0.45);
    for(let i=n-1;i>=0;i--)o.push(R[i*2],R[i*2+1]);o.push(c[0]-d0x*p.w0*0.45,c[1]-d0y*p.w0*0.45)}
  return p.poly=o;
}
function bbox(o){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<o.length;i+=2){const x=o[i],y=o[i+1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return{x:x0,y:y0,w:x1-x0,h:y1-y0}}
function eyes(P,dx,y,r,angry){
  for(const sd of[-1,1]){
    P.push(pe(sd*dx,y,r,r*0.92,'eye'),pe(sd*dx,y+r*0.1,r*0.4,r*0.75,'pupil'),pe(sd*dx-r*0.3,y-r*0.38,r*0.26,r*0.26,'glint'));
    if(angry)P.push(pp([sd*(dx+r*1.4),y-r*1.55,sd*(dx-r*1.3),y-r*0.8,sd*(dx-r*1.2),y-r*0.3,sd*(dx+r*1.4),y-r*0.95],'dark',false));
  }
}
/* 恐龙：f = 0..3 动画帧（正面朝镜头走来；补给兽为侧面奔跑，朝 +x） */
function dinoParts(type,f){
  const ph=f*Math.PI/2,s=Math.sin(ph),c=Math.cos(ph),P=[],L=Math.max(0,s),R=Math.max(0,-s);
  if(type==='compy')return dinoParts('raptor',f);
  if(type==='ankyking'){
    P.push(...dinoParts('ankylo',f));
    for(let i=0;i<5;i++){const a=Math.PI*(1.25+i*0.125),x=Math.cos(a)*46,y=-14+Math.sin(a)*27;P.push(pp([x-5,y+2,x+Math.cos(a)*16,y+Math.sin(a)*16,x+5,y+2],'accent',false))}
    P.push(pp([-10,-24,-9,-35,-4,-29,0,-38,4,-29,9,-35,10,-24],'crown',false),pe(0,-29,2,2,'gem'));
    return P;
  }
  if(type==='pteroq'){
    const b=Math.cos(f*Math.PI/2)*2;
    P.push(pp([-4,-78+b,-10,-108+b,0,-92+b,10,-108+b,4,-78+b],'accent',false));
    P.push(...dinoParts('ptero',f));
    P.push(pp([-7,-78+b,-6,-86+b,-3,-82+b,0,-88+b,3,-82+b,6,-86+b,7,-78+b],'crown',false),pe(0,-81+b,1.4,1.4,'gem'));
    return P;
  }
  if(type==='tyrant'){
    const b=-Math.abs(Math.sin(f*Math.PI/2))*2;
    for(let i=0;i<6;i++){const x=(i-2.5)*9,y=-78+Math.abs(i-2.5)*5+b;P.push(pp([x-5,y+6,x,y-12-(i%2)*4,x+5,y+6],'accent',false))}
    P.push(...dinoParts('trex',f));
    P.push(pl([10,-112+b,20,-100+b],'line',1.1),pl([14,-114+b,22,-106+b],'line',0.8),pl([-20,-70+b,-12,-58+b],'line',0.9));
    return P;
  }
  if(type==='ovi'){
    /* 窃蛋龙：两足、羽毛臂、头冠 + 鹦鹉喙，怀里抱着偷来的蛋 */
    const b=-Math.abs(s)*2.5,hb=b-s;
    P.push(pt([6,-44+b,22,-48+b,36+s*5,-58+b],8,1.5,'body'),pp([30+s*5,-62+b,44+s*6,-66+b,38+s*5,-54+b],'accent',false));
    for(const sd of[-1,1]){const lf=(sd<0?L:R)*6;
      P.push(pt([sd*7,-42+b,sd*12,-26-lf*0.6,sd*11,-6-lf],8,4,'body'));
      P.push(pp([sd*5,-1-lf,sd*18,-1-lf,sd*16,-6-lf,sd*8,-7-lf],'dark'))}
    for(const sd of[-1,1])P.push(pp([sd*8,-64+b,sd*26,-60+b,sd*24,-50+b,sd*14,-46+b],'accent'));
    P.push(pe(0,-52+b,13,17,'body'),pe(0,-48+b,8,12,'belly'));
    for(const sd of[-1,1])P.push(pt([sd*10,-60+b,sd*15,-52+b,sd*6,-50+b],4.5,3,'body'));
    P.push(pe(0,-54+b,7,8.5,'egg'),pe(-2.5,-57+b,2,2.4,'glint'));
    P.push(pt([0,-66+b,0,-80+hb],8,7,'body'));
    P.push(pp([-5,-92+hb,-4,-106+hb,3,-110+hb,7,-96+hb],'accent'));
    P.push(pe(0,-87+hb,10,9,'body'),pp([-6,-83+hb,6,-83+hb,0,-73+hb],'horn',false),pl([-5,-82+hb,5,-82+hb],'line',0.7));
    eyes(P,5,-89+hb,3.1,false);
    return P;
  }
  if(type==='para'){
    /* 副栉龙：鸭嘴、头顶长管状冠，会鸣叫给同伴加速 */

/* ================= 部件光栅化：卡通 ================= */
function pathPoly(g,o,closed){g.beginPath();g.moveTo(o[0],o[1]);for(let i=2;i<o.length;i+=2)g.lineTo(o[i],o[i+1]);if(closed)g.closePath()}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const FLAT={eye:1,pupil:1,glint:1,mouth:1,tooth:1,tongue:1,heal:0,charge:0};
const SHINE={egg:1,body:1,belly:1,armor:1,horn:1,bronze:1,amber:1,helmet:1,stone:1,bone:1,crate:1,wing:1,accent:1,claw:1,shirt:1,pack:1,rock:1,canvas:1,heal:1,charge:1,cloth:1};

function toonDraw(g,parts,pal,opt){
  opt=opt||{};const ow=opt.ow||3,r=rng(opt.seed||7);
  g.lineJoin='round';g.lineCap='round';
  // 外轮廓加粗
  g.strokeStyle=pal.ink;g.lineWidth=ow*2.1;
  for(const p of parts){if(p.k==='l'||p.r==='glint')continue;pathPoly(g,toPoly(p),true);g.stroke()}
  for(const p of parts){
    const col=pal[p.r]||'#ff00ff',o=toPoly(p);
    if(p.k==='l'){pathPoly(g,o,false);g.strokeStyle=pal.ink;g.lineWidth=p.w*ow*0.7;g.stroke();continue}
    pathPoly(g,o,true);
    if(p.r!=='glint'){g.strokeStyle=FLAT[p.r]?pal.ink:mixHex(pal.ink,col,0.25);g.lineWidth=ow*(p.r==='pupil'?0.5:0.85);g.stroke()}
    const bb=bbox(o);
    if(FLAT[p.r]||bb.h<3){g.fillStyle=col;g.fill();continue}
    const gr=g.createLinearGradient(0,bb.y,0,bb.y+bb.h);
    gr.addColorStop(0,shade(col,0.24));gr.addColorStop(0.5,col);gr.addColorStop(1,shade(col,-0.34));
    g.fillStyle=gr;g.fill();
    if(SHINE[p.r]&&bb.w>5){
      g.save();pathPoly(g,o,true);g.clip();
      const R=Math.max(bb.w,bb.h);
      const hl=g.createRadialGradient(bb.x+bb.w*0.34,bb.y+bb.h*0.24,0,bb.x+bb.w*0.34,bb.y+bb.h*0.24,R*0.62);
      hl.addColorStop(0,'rgba(255,255,255,0.42)');hl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=hl;g.fillRect(bb.x,bb.y,bb.w,bb.h);
      // 底部反光（环境光）
      const rim=g.createLinearGradient(0,bb.y+bb.h*0.75,0,bb.y+bb.h);rim.addColorStop(0,'rgba(0,0,0,0)');rim.addColorStop(1,opt.rim||'rgba(255,190,120,0.22)');
      g.fillStyle=rim;g.fillRect(bb.x,bb.y,bb.w,bb.h);
      if((p.r==='body'||p.r==='armor')&&bb.w>14&&!opt.nospots){
        g.fillStyle=shade(col,-0.28);g.globalAlpha=0.45;
        const n=Math.round(bb.w*bb.h/90);
        for(let i=0;i<n;i++){const x=bb.x+r()*bb.w,y=bb.y+bb.h*(0.15+r()*0.7),s=0.6+r()*1.6;g.beginPath();g.ellipse(x,y,s*1.3,s,0,0,PI2);g.fill()}
        g.globalAlpha=1;
      }
      g.restore();
    }
  }
}
/* 烘焙：返回 {c, ox, oy, sc}（ox/oy 设计单位，c 像素 = 设计单位×sc） */
function bake(partsList,sc,draw,pal,opt,pad){
  pad=pad||6;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const parts of partsList)for(const p of parts){const b=bbox(toPoly(p));x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)}
  x0-=pad;y0-=pad;x1+=pad;y1+=pad;
  return partsList.map((parts,i)=>{
    const c=document.createElement('canvas');c.width=Math.max(2,Math.ceil((x1-x0)*sc));c.height=Math.max(2,Math.ceil((y1-y0)*sc));
    const g=c.getContext('2d');g.scale(sc,sc);g.translate(-x0,-y0);draw(g,parts,pal,Object.assign({seed:17+i*31},opt));
    return{c,ox:x0,oy:y0,sc};
  });
}
function whiteOf(s,col){const c=document.createElement('canvas');c.width=s.c.width;c.height=s.c.height;const g=c.getContext('2d');g.drawImage(s.c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col||'#fff';g.fillRect(0,0,c.width,c.height);return{c,ox:s.ox,oy:s.oy,sc:s.sc}}
function blit(ctx,s,x,y,u,flip){
  const w=s.c.width/s.sc*u,h=s.c.height/s.sc*u;
  if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(s.c,s.ox*u,s.oy*u,w,h);ctx.restore()}
  else ctx.drawImage(s.c,x+s.ox*u,y+s.oy*u,w,h);
}
function drawPartsAt(ctx,parts,x,y,u,draw,pal,opt){ctx.save();ctx.translate(x,y);ctx.scale(u,u);draw(ctx,parts,pal,opt);ctx.restore()}

  const boss={4:'ankyking',6:'trex',8:'pteroq',10:'tyrant',12:'spino',14:'titan'}[n]||(n>=16&&n%2===0?BOSSES[(n/2-8)%6]:null);
  const r=rng(n*7919+13),heavy=[],light=[];
  for(const t in c){let m=c[t];
    if(t==='compy')while(m>0){const g=Math.min(5,m);light.push({type:t,sw:g});m-=g}
    else for(let i=0;i<m;i++)(TYPES[t].heavy?heavy:light).push({type:t})}
  for(let i=light.length-1;i>0;i--){const j=r()*(i+1)|0;[light[i],light[j]]=[light[j],light[i]]}
  // 精英：第 3 波起，每两波多一个，最多 6 个
  const elig=light.concat(heavy).filter(it=>ELITE_OK[it.type]);
  for(let i=0,ne=n>=4?Math.min(5,1+((n-4)>>1)):0;i<ne&&elig.length;i++){const it=elig.splice(r()*elig.length|0,1)[0];it.el=AFFIX[(n+i)%3]}
  // 重甲均匀插入，间隔至少 3 个
  const seq=light.slice(),step=Math.max(3,Math.floor((light.length+heavy.length)/(heavy.length+1)));
  heavy.forEach((h,i)=>seq.splice(Math.min(seq.length,(i+1)*step+i),0,h));
  let t=2.2,lastX=0;const list=[];
  for(const it of seq){
    let x;do{x=(r()*1.6-0.8)*(TYPES[it.type].heavy?0.75:1)}while(Math.abs(x-lastX)<0.32);lastX=x;
    if(it.sw){for(let i=0;i<it.sw;i++)list.push({t:t+i*0.16,type:'compy',x:clamp(x+(r()-0.5)*0.4,-0.95,0.95)});t+=gap*1.3}
    else{list.push({t,type:it.type,x,el:it.el});t+=gap*(TYPES[it.type].heavy?1.5:(0.8+r()*0.4))*(st>=2&&r()<0.25?0.45:1)}
  }
  if(boss)list.push({t:t*0.45,type:boss,x:0});
  list.sort((a,b)=>a.t-b.t);
  const sup=[];for(let i=0;i<supN;i++)sup.push({t:2+t*(i+0.5)/supN+(i?0:2),side:(n+i)%2?1:-1,z:3.6+r()*2.2});
  return{n,st,list,sup,hpMul,supHp,dur:t,boss};
}

function cardOk(o){if(o.sold)return false;if(o.t==='hire'&&K.allies.length>=4)return false;if(o.t==='fix'&&S.hp>=HPMAX)return false;if(o.t==='wup'&&K.w[o.k]>=3)return false;if(o.t==='aup'&&K.allies[o.i].lv>=3)return false;return true}

function buyCard(i){
  const o=offers[i];if(!o||!cardOk(o))return;

  if(o.t==='buy'){K.w[o.k]=1;K.cur=o.k}

/* 自动购物（测试 / 平衡机器人用）：补栅 > 前两名队友 > 新武器 > 升级 */
function autoShop(){
  if(!S.shop)return;
  const rank=o=>o.t==='fix'?(S.hp<=6?0:9):o.t==='hire'?(K.allies.length<2?1:4):o.t==='buy'?2:o.t==='wup'?3:o.t==='aup'?5:6;
  for(let g=0;g<12;g++){
    const c=offers.map((o,i)=>({o,i})).filter(q=>cardOk(q.o)&&q.o.p<=K.coins&&rank(q.o)<9).sort((a,b)=>rank(a.o)-rank(b.o))[0];
    if(!c)break;buyCard(c.i);
  }
  if(K.w.spear)K.cur='spear';else if(K.w.scatter)K.cur='scatter';
  if(K.w.gren&&!K.w.spear)K.cur='gren';
  renderBar();closeShop();

const SU=()=>U/100*1.1;
function fireWeapon(k,lv,mx,my,tx,ty2,ch){
  const w=WEAPONS[k],a0=Math.atan2(ty2-my,tx-mx),bl=Math.hypot(tx-mx,ty2-my),m=MUZ(),dm=w.dmg[lv-1],tg=S.lockE;
  const shoot=(a,o)=>{const s=(o&&o.spd)||w.spd;S.bullets.push(Object.assign({x:mx+Math.cos(a)*m,y:my-2+Math.sin(a)*m,vx:Math.cos(a)*s,vy:Math.sin(a)*s,spd:s,left:bl+60,age:0,
    col:ch?'#ffd23a':w.col,dmg:dm,kind:k,src:'p',tgt:tg,turn:0},o))};
  if(k==='bone'){const n=ch?3:1;for(let i=0;i<n;i++)shoot(a0+(i-(n-1)/2)*0.07,{turn:9});sfx('shot')}
  else if(k==='scatter'){const n=w.n[lv-1]+(ch?3:0);for(let i=0;i<n;i++)shoot(a0+(Math.random()-0.5)*w.spread,{spd:w.spd*(0.85+Math.random()*0.3),left:bl+90,kind:'pellet',tgt:null});sfx('scatter');S.shake=Math.max(S.shake,0.07)}
  else if(k==='spear'){shoot(a0,{left:bl+H,pierce:1,hit:[],turn:5});if(ch)shoot(a0+0.06,{left:bl+H,pierce:1,hit:[],turn:5});sfx('spear')}
  else{S.lobs.push({x0:mx+Math.cos(a0)*m,y0:my+Math.sin(a0)*m,x1:tx,y1:ty2,t:0,T:0.5,kind:'gren',dmg:dm*(ch?1.3:1),R:w.aoe[lv-1]*U,src:'p'});sfx('gren')}
}
const AMUZ={rifle:[20,-84],hawk:[14,-52],boom:[20,-48],tamer:[-30,-82]};
function allyPos(i){return{x:ASLOTS[i]*W,y:by+AY()}}
function allyTarget(k){
  const vis=S.enemies.filter(e=>!e.dead&&!e.dive&&e.z<ZMAX-0.3&&(e.type!=='supply'||Math.abs(e.x)<1.1));
  if(!vis.length)return null;
  const zk=e=>e.type==='supply'?99:e.z,byZ=a=>a.sort((p,q)=>zk(p)-zk(q))[0];
  const near=()=>byZ(vis.slice());
  if(k==='rifle')return near();
  if(k==='hawk')return vis.find(e=>e.type==='supply')||byZ(vis.filter(e=>TYPES[e.type].fly||e.type==='dilo'))||near();
  if(k==='boom')return vis.filter(e=>TYPES[e.type].heavy).sort((a,b)=>b.hp-a.hp)[0]||vis.filter(e=>e.type!=='supply').sort((a,b)=>b.hp-a.hp)[0]||near();
  return vis.find(e=>e.type==='pachy'&&e.ps>=1&&!(e.slowT>0))||byZ(vis.filter(e=>!(e.slowT>0)&&e.type!=='supply'))||near();
}
function allyFire(al,i,t){
  const A=ALLIES[al.k],P=allyPos(i),u=SU(),mo=AMUZ[al.k],x=P.x+mo[0]*u,y=P.y+mo[1]*u,dm=A.dmg[al.lv-1];
  if(A.proj==='ally'||A.proj==='arrow'){
    const s=A.proj==='ally'?1400:1300,d=Math.hypot(t.sx-x,t.sy-y),tt=d/s,tx=t.sx+t.vx*tt,tyy=t.sy+t.vy*tt,a=Math.atan2(tyy-y,tx-x);
    S.bullets.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,spd:s,left:d+80,age:0,col:A.col,dmg:dm,kind:A.proj,src:'a',tgt:t,turn:A.proj==='ally'?12:16});
    sfx('ashot');
  }else{
    const T=A.proj==='dyn'?0.7:0.5,tx=t.sx+t.vx*T,tyy=t.sy+t.vy*T;
    S.lobs.push({x0:x,y0:y,x1:tx,y1:tyy,t:0,T,kind:A.proj,dmg:dm,R:(A.proj==='dyn'?A.aoe[al.lv-1]:0.55)*U,src:'a',slow:A.slow?A.slow[al.lv-1]:0});
    sfx(A.proj==='dyn'?'gren':'net');
  }
  al.fire=1;
}
function spit(e){
  const tx=proj(e.x,0).x;S.spits.push({x0:e.sx,y0:e.py-e.h*0.82,x1:tx,y1:by-16,t:0,T:1.1,x:e.sx,y:e.py-e.h*0.82});sfx('spit');

/* ================= 更新 ================= */
function update(dt){
  if(S.hs>0){S.hs-=dt;dt*=0.2}
  S.t+=dt;
  if(S.stageFade<1)S.stageFade=Math.min(1,S.stageFade+dt/2);
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('show')}
  if(hintT>0){hintT-=dt*(S.firing?1.6:1);if(hintT<=0)$('hint').classList.add('off')}
  S.shake=Math.max(0,S.shake-dt*1.6);S.flash=Math.max(0,S.flash-dt);
  // 波次
  const wv=S.wv;
  if(!S.dead&&!S.shop){
    S.wt+=dt;
    while(S.qi<wv.list.length&&S.wt>=wv.list[S.qi].t-(TYPES[wv.list[S.qi].type].heavy?1.6:0)){
      const it=wv.list[S.qi++],T=TYPES[it.type];
      if(T.heavy){S.tele.push({it,t:T.boss?2.4:1.6,max:T.boss?2.4:1.6});if(T.boss){sfx('warn');sfx('riser');banner(tr('bossT',tr('d_'+it.type)),tr('bossS',Math.round(T.hp*wv.hpMul),T.dmg,tr('bh_'+it.type)),2.2)}}
      else spawn(it.type,it.x,wv.hpMul,it.el);
    }
    for(const tl of S.tele){tl.t-=dt;if(tl.t<=0){spawn(tl.it.type,tl.it.x,wv.hpMul,tl.it.el);tl.done=1}}
    S.tele=S.tele.filter(t=>!t.done);
    while(S.si<wv.sup.length&&S.wt>=wv.sup[S.si].t){spawnSupply(wv.sup[S.si++])}
    if(S.qi>=wv.list.length&&S.si>=wv.sup.length&&!S.tele.length&&!S.enemies.length&&!S.spits.length){
      if(!S.inter){
        const bonus=50*S.wave+(S.noDmg?150:0),cb=10+3*S.wave+(S.noDmg?15:0);S.score+=bonus;S.inter=1.8;sfx('wave');
        gainCoins(cb,cx,hy+(by-hy)*0.4);
        banner(tr('cleared',S.wave),tr('clearB',bonus)+(S.noDmg?tr('noDmg'):'')+'<br>'+tr('clearC',cb),1.8);updHUD();
      }else{S.inter-=dt;if(S.inter<=0)openShop()}
    }
  }
  // 连击
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0){S.combo=0;updHUD()}}
  // 敌人
  for(const e of S.enemies){
    e.t+=dt;e.flash=Math.max(0,e.flash-dt*6);if(e.armT>0)e.armT-=dt;e.hitT=Math.max(0,(e.hitT||0)-dt);
    let slow=e.slowT>0?0.4:1;if(e.slowT>0)e.slowT-=dt;
    if(e.hasteT>0){e.hasteT-=dt;slow*=1.3}
    if(e.el==='regen'&&!e.dead){e.calm+=dt;if(e.calm>1&&e.hp<e.max){e.hp=Math.min(e.max,e.hp+e.max*0.06*dt);if(Math.random()<dt*4)burst(e.sx,e.sy,'#7dff9a',1,50,0.5,'star',0.6)}}
    if(e.type==='supply'){
      e.life-=dt;if(e.stun>0)e.stun-=dt;else e.x+=e.dir*4.6/7.5*dt*slow;
      if(e.life<=0||Math.abs(e.x)>2.4){e.gone=1;const p=proj(clamp(e.x,-1,1),e.z);addText(p.x,p.y-30,tr('f_esc'),"#ffd447",14);sfx('escape')}
    }else{
      let sp=e.spd*slow;
      if(e.type==='dilo'&&e.z<=e.stopZ){sp=0;e.spitT-=dt*slow;e.wind=e.spitT<0.6;if(e.spitT<=0){e.spitT=2.4;spit(e)}}
      if(e.type==='pachy'){
        if(e.ps===0&&e.z<5.5){e.ps=1;e.pw=0.7;sfx('charge')}
        if(e.ps===1){sp=0;e.pw-=dt;if(e.pw<=0)e.ps=2}
        if(e.ps===2)sp=3.6*slow;
      }
      e.z-=sp*dt;
      if(e.type==='ptero')e.x=e.x0*0.6+Math.sin(e.t*1.6+e.ph)*0.45;
      else if(e.type==='pteroq'){e.x=Math.sin(e.t*0.9+e.ph)*0.55;e.sumT-=dt;if(e.sumT<=0&&!S.dead){e.sumT=3.5;for(const d of[-1,1]){const m=spawn('ptero',clamp(e.x+d*0.3,-0.9,0.9),S.wv.hpMul);m.z=Math.min(ZMAX,e.z+0.4)}sfx('warn')}}
      else if(e.type==='tyrant'&&!e.rage&&e.hp<e.max*0.5){e.rage=1;e.spd*=1.8;sfx('roar');S.shake=Math.max(S.shake,0.45);addText(e.sx,e.sy-e.sr-20,tr('rage'),'#ff3a1a',24)}
      else if(e.type==='ovi')e.x=clamp(e.x0+Math.sin(e.t*3.1+e.ph)*0.28,-0.95,0.95);
      else if(e.type==='para'){e.honkT-=dt;if(e.honkT<=0&&e.z<ZMAX-0.5){e.honkT=3.2;e.honk=0.6;haste(e,0.55,2.6,2.2);sfx('honk')}if(e.honk>0)e.honk-=dt}
      else if(e.type==='stego'){e.plT-=dt;if(e.plT<=0){if(e.plate){e.plate=0;e.plT=2.6}else{e.plate=1;e.plT=1.1}}}
      else if(e.type==='spino'){e.dvT-=dt;if(e.dvT<=0){if(e.dive){e.dive=0;e.dvT=4.2;e.spd/=2.2;S.shake=Math.max(S.shake,0.3);burst(e.px,e.gy,'#c8a878',14,160,0.8,'dust',2.6);sfx('roar')}else{e.dive=1;e.dvT=1.6;e.spd*=2.2;burst(e.px,e.gy,'#c8a878',10,120,0.6,'dust',2.2)}}
        if(e.dive&&Math.random()<dt*20)burst(e.px+(Math.random()-0.5)*e.h*0.3,e.gy,'#c8a878',1,50,0.5,'dust',1.8);e.x=Math.sin(e.t*0.7+e.ph)*0.35}
      else if(e.type==='titan'){e.stT-=dt;if(e.stT<=0&&!S.dead){e.stT=5;S.shake=Math.max(S.shake,0.55);S.heat=Math.min(99,S.heat+30);haste(e,3,99,1.6);ring(e.px,e.gy,e.h*1.2,'#e8c890');burst(e.px,e.gy,'#c8a878',18,200,0.9,'dust',3);addText(e.sx,e.gy-20,tr('stomp'),'#ffb070',18);sfx('boom')}}
      else if(e.type==='raptor')e.x=e.x0+Math.sin(e.t*2.2+e.ph)*0.06;
      else if(e.type==='compy')e.x=e.x0+Math.sin(e.t*4+e.ph)*0.05;
      if(e.z<=0&&!S.dead){e.gone=1;baseHit(e)}
    }
    const T=TYPES[e.type],p=proj(e.x,e.z),h=U*T.size*p.s*(e.el?1.18:1);
    e.px=p.x;e.gy=p.y;e.py=p.y-(T.fly?h*0.35+Math.sin(e.t*3)*4:0);e.h=h;
    const nsx=p.x,nsy=e.py-h*T.cy;
    if(e.sx!==undefined&&dt>1e-4){e.vx=lerp(e.vx,(nsx-e.sx)/dt,0.25);e.vy=lerp(e.vy,(nsy-e.sy)/dt,0.25)}
    e.sx=nsx;e.sy=nsy;e.sr=h*T.hr;e.q=p.q;
  }
  S.enemies=S.enemies.filter(e=>!e.gone&&!e.dead);
  // 瞄准吸附：补给兽吸附范围更大且优先
  S.lockE=null;let bd=1e9;
  for(const e of S.enemies){if(e.dive)continue;const sup=e.type==='supply',d=Math.hypot(e.sx-S.aim.x,e.sy-S.aim.y);if(d<e.sr+(sup?64:28)){const sc=d-(sup?80:0);if(sc<bd){bd=sc;S.lockE=e}}}
  // 炮台：瞄准提前量
  const mx=cx,my=ty-10,w=WEAPONS[K.cur],L=S.lockE;
  let tx=S.aim.x,tyy=S.aim.y;
  if(L){const tt=w.lob?0.5:Math.hypot(L.sx-mx,L.sy-my)/w.spd;tx=L.sx+L.vx*tt;tyy=L.sy+L.vy*tt}
  S.turretA=Math.atan2(tyy-my,tx-mx);
  if(S.charge>0)S.charge-=dt;
  if(S.over>0){S.over-=dt;S.heat=Math.max(0,S.heat-dt*70);if(S.over<=0)S.heat=0}
  S.fireCD-=dt;S.rec=Math.max(0,S.rec-dt*14);
  if(S.firing&&!S.dead&&!S.shop&&S.over<=0){
    S.heat=Math.max(0,S.heat-dt*12);
    if(S.fireCD<=0){
      const lv=K.w[K.cur],ch=S.charge>0;
      S.fireCD=w.cd[lv-1]*(ch?0.7:1)*(S.combo>=20?0.8:1);
      fireWeapon(K.cur,lv,mx,my,tx,tyy,ch);
      if(!ch){S.heat+=w.heat*(1-0.15*K.cool);if(S.heat>=100){S.heat=100;S.over=1.5;sfx('heat');addText(cx,ty-70,tr('f_heat'),'#ff7a3d',16)}}
      S.fired++;S.rec=1;
    }
  }else S.heat=Math.max(0,S.heat-dt*45);
  // 队友
  K.allies.forEach((al,i)=>{
    al.fire=Math.max(0,al.fire-dt*5);al.cd-=dt;
    if(al.cd<=0&&!S.dead&&!S.shop){const t=allyTarget(al.k);if(t){al.cd=ALLIES[al.k].cd[al.lv-1]*(S.combo>=20?0.85:1);allyFire(al,i,t)}else al.cd=0.2}
  });
  // 子弹（追踪 + 分段碰撞）
  for(const b of S.bullets){
    const st=dt/3;
    for(let k=0;k<3&&!b.dead;k++){
      const tg=b.tgt;
      if(b.turn&&tg&&!tg.dead&&!tg.gone){
        const want=Math.atan2(tg.sy-b.y,tg.sx-b.x),cur=Math.atan2(b.vy,b.vx);let da=want-cur;da=Math.atan2(Math.sin(da),Math.cos(da));
        const mt=b.turn*st,na=cur+clamp(da,-mt,mt);b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;if(!b.pierce)b.left=Math.max(b.left,40);
      }
      b.x+=b.vx*st;b.y+=b.vy*st;b.left-=b.spd*st;b.age+=st;
      for(const e of S.enemies){
        if(e.dead||e.dive||b.hit&&b.hit.includes(e))continue;const dx=b.x-e.sx,dy=b.y-e.sy,r=e.sr+4;
        if(dx*dx+dy*dy<r*r){
          const hv=TYPES[e.type].heavy;burst(b.x,b.y,hv?'#fff2c0':TYPES[e.type].col,b.kind==='pellet'?2:3,140,0.3,hv?'star':null,0.8);
          hurt(e,b.dmg,b.src,b.kind);
          if(b.pierce){b.hit.push(e);b.dmg*=0.85}else{b.dead=1;break}
        }
      }
      if(!b.dead)for(const sp of S.spits)if(!sp.dead&&Math.hypot(sp.x-b.x,sp.y-b.y)<16){sp.dead=1;burst(sp.x,sp.y,'#8aff6a',8,140,0.4);addText(sp.x,sp.y-14,tr('f_pop'),'#8aff6a',13);if(!b.pierce)b.dead=1;break}
      if(!b.dead&&(b.left<=0||b.age>1.5||b.y<hy-90||b.x<-40||b.x>W+40)){b.dead=1;burst(b.x,b.y,'#d8b888',2,40,0.35,'dust',1.2)}
    }
  }
  S.bullets=S.bullets.filter(b=>!b.dead);
  // 抛射物
  for(const l of S.lobs){
    l.t+=dt;const k=Math.min(1,l.t/l.T),arc=50+Math.abs(l.y1-l.y0)*0.25;
    l.x=lerp(l.x0,l.x1,k);l.y=lerp(l.y0,l.y1,k)-arc*Math.sin(Math.PI*k);l.k=k;
    if(k>=1){l.dead=1;explode(l.x1,l.y1,l.R*sAtY(l.y1),l.dmg,l.src,l.slow)}
  }
  S.lobs=S.lobs.filter(l=>!l.dead);
  // 双冠龙酸液
  for(const sp of S.spits){
    if(sp.dead)continue;sp.t+=dt;const k=Math.min(1,sp.t/sp.T);
    sp.x=lerp(sp.x0,sp.x1,k);sp.y=lerp(sp.y0,sp.y1,k)-(40+(sp.y1-sp.y0)*0.2)*Math.sin(Math.PI*k);
    if(k>=1){sp.dead=1;if(!S.dead){burst(sp.x,sp.y,'#8aff6a',10,160,0.6);fenceDmg(1,sp.x,'dilo',tr('f_spit'))}}
  }
  S.spits=S.spits.filter(s=>!s.dead);
  for(const p of S.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.98}
  S.parts=S.parts.filter(p=>p.t<p.life);
  for(const t of S.texts)t.t+=dt;S.texts=S.texts.filter(t=>t.t<1.1);
  for(const c of S.coinFx)c.t+=dt;S.coinFx=S.coinFx.filter(c=>c.t<c.T);
  // 装饰：流星、尘埃、火山烟、翼龙群
  if(S.stage>=3&&Math.random()<dt*(S.stage===4?1.6:0.8))S.meteors.push({x:Math.random()*W*1.2,y:-10,v:300+Math.random()*300,t:0,s:2+Math.random()*3});
  if(S.dust.length<(S.stage===4?50:24))S.dust.push({x:Math.random()*W,y:hy+Math.random()*(H-hy),vx:(Math.random()-0.3)*14,vy:S.stage===4?-20-Math.random()*20:-4-Math.random()*6,s:0.8+Math.random()*1.8,a:0.2+Math.random()*0.5,t:0,l:3+Math.random()*4});
  for(const d of S.dust){d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt}S.dust=S.dust.filter(d=>d.t<d.l&&d.y>hy-20);
  for(const m of S.meteors){m.t+=dt;m.x-=m.v*0.55*dt;m.y+=m.v*dt}S.meteors=S.meteors.filter(m=>m.y<hy-10);
  if(Math.random()<dt*(S.stage>=2?2.6:1.2))S.smoke.push({x:W*0.3+(Math.random()-0.5)*8,y:hy-hy*0.31,t:0,l:3.5+Math.random()*1.5,s:6+Math.random()*4,vx:8+Math.random()*10});
  for(const m of S.smoke){m.t+=dt;m.x+=m.vx*dt;m.y-=16*dt}S.smoke=S.smoke.filter(m=>m.t<m.l);
  if(S.flocks.length<2&&Math.random()<dt*0.12){const d=Math.random()<0.5?1:-1;S.flocks.push({x:d>0?-40:W+40,y:hy*(0.2+Math.random()*0.4),d,n:3+(Math.random()*4|0),t:0,v:30+Math.random()*20})}
  for(const f of S.flocks){f.t+=dt;f.x+=f.d*f.v*dt}S.flocks=S.flocks.filter(f=>f.x>-80&&f.x<W+80);
}

function drawTurret(){

  const col=ch?'#ffd23a':S.over>0?(S.t*8%1<0.5?'#ff3a2a':'#ffb0a0'):heat>0.7?'#ff5a2a':'#ffb030';

  // 当前武器标记：炮口套环
  ctx.fillStyle=w.col;ctx.strokeStyle=INK();ctx.lineWidth=1.6;rr(44*u,-10*u,6*u,20*u,2*u);ctx.fill();ctx.stroke();
  if(heat>0.05||S.over>0){ctx.globalCompositeOperation=toon?'lighter':'source-over';ctx.globalAlpha=(S.over>0?0.75:heat*0.6)*(toon?1:0.5);ctx.fillStyle=toon?'#ff4a10':'#ff5a3a';
    ctx.beginPath();ctx.ellipse(30*u,0,26*u,8*u,0,0,PI2);ctx.fill();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
  if(S.rec>0.4){
    const m=54*u,big=K.cur==='scatter'?1.6:K.cur==='spear'?1.2:1;ctx.fillStyle=ch?'#fff6a0':'#ffe0a0';
    if(toon){ctx.globalCompositeOperation='lighter';ctx.drawImage(glow(ch?'#ffd23a':w.col),m-14*big,-22*big,44*big,44*big);ctx.globalCompositeOperation='source-over'}
    ctx.beginPath();ctx.moveTo(m,-7*big);ctx.lineTo(m+22*big,0);ctx.lineTo(m,7*big);ctx.lineTo(m+8,0);ctx.closePath();ctx.fill();
    if(!toon){ctx.strokeStyle='#2b2b38';ctx.lineWidth=1.8;ctx.stroke()}
  }
  ctx.restore();
  // 热量文字（只在有热量时）
  if(k>0.05){
    ctx.font='900 11px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    const label=ch?tr('h_charge',S.charge.toFixed(1)):S.over>0?tr('h_over'):tr('h_heat')+' '+Math.round(S.heat),lx=x+R+6,ly=y+6+ry*0.35;
    ctx.lineWidth=3;ctx.strokeStyle=toon?'rgba(20,10,0,0.85)':'#fff';ctx.strokeText(label,lx,ly);
    ctx.fillStyle=ch?'#ffd23a':S.over>0?'#ff5a3a':toon?'#ffe8c0':'#2b2b38';ctx.fillText(label,lx,ly);
  }
}
function drawAim(){
  if(S.dead||S.shop)return;
  const L=S.lockE,x=L?L.sx:S.aim.x,y=L?L.sy:S.aim.y,r=L?Math.max(16,L.sr*0.95):15;
  const ink=TH==='toon'?'#fff':'#2b2b38',hot=L&&L.type==='supply'?'#ffc23a':TH==='toon'?'#ff4a2a':'#e8302a';
  ctx.save();
  ctx.strokeStyle=ink;ctx.globalAlpha=0.4;ctx.lineWidth=2;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(cx,ty-10);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  if(TH==='toon'){ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.stroke()}
  ctx.strokeStyle=L?hot:ink;ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.stroke();
  for(let i=0;i<4;i++){const a=i*Math.PI/2+S.t*(L?3:0.8);ctx.beginPath();ctx.moveTo(x+Math.cos(a)*(r-5),y+Math.sin(a)*(r-5));ctx.lineTo(x+Math.cos(a)*(r+8),y+Math.sin(a)*(r+8));ctx.stroke()}
  ctx.fillStyle=L?hot:ink;ctx.beginPath();ctx.arc(x,y,2.4,0,PI2);ctx.fill();
  // 榴弹：落点范围
  if(WEAPONS[K.cur].lob){const R=WEAPONS.gren.aoe[K.w.gren-1]*U*sAtY(y);ctx.globalAlpha=0.35;ctx.setLineDash([5,5]);ctx.strokeStyle=hot;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,R,R*0.6,0,0,PI2);ctx.stroke()}
  ctx.restore();
}
function drawParts(){
  const toon=TH==='toon';
  for(const p of S.parts){
    const a=1-p.t/p.life;ctx.globalAlpha=Math.min(1,a*1.4);
    if(p.k==='boom'){const r=p.s*(0.45+0.75*p.t/p.life);
      if(toon){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.drawImage(glow('#ff8a2a'),p.x-r*1.4,p.y-r*1.4,r*2.8,r*2.8);ctx.restore()}
      else{ctx.fillStyle='#ffd23a';ctx.strokeStyle='#2b2b38';ctx.lineWidth=2.4;ctx.beginPath();for(let i=0;i<16;i++){const rr2=i%2?r*0.7:r;ctx.lineTo(p.x+Math.cos(i*Math.PI/8)*rr2,p.y+Math.sin(i*Math.PI/8)*rr2*0.75)}ctx.closePath();ctx.fill();ctx.stroke()}
      continue}
    if(p.k==='ring'){const r=p.s*(0.3+p.t/p.life*1.2);ctx.strokeStyle=p.col||(toon?'rgba(255,240,200,'+a+')':'#2b2b38');ctx.lineWidth=3*a+0.5;ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*0.75,0,0,PI2);ctx.stroke();continue}
    if(p.k==='dust'){const r=p.s*(0.6+p.t/p.life);ctx.fillStyle=toon?'rgba(210,180,140,'+(a*0.55)+')':'rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,r,0,PI2);ctx.fill();if(!toon){ctx.strokeStyle='rgba(43,43,56,'+a*0.7+')';ctx.lineWidth=1.6;ctx.stroke()}continue}
    if(p.k==='bone'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*10*p.vr);ctx.fillStyle=toon?'#f2e6c8':'#fff';ctx.strokeStyle=toon?'#3a2412':'#2b2b38';ctx.lineWidth=1.5;
      const l=p.s*1.6;rr(-l,-1.6,l*2,3.2,1.6);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(-l,-1.8,2,0,PI2);ctx.arc(-l,1.8,2,0,PI2);ctx.arc(l,-1.8,2,0,PI2);ctx.arc(l,1.8,2,0,PI2);ctx.fill();ctx.restore();continue}
    if(p.k==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*4);ctx.fillStyle=p.col;ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*0.45:p.s;ctx.lineTo(Math.cos(i*Math.PI/5)*r,Math.sin(i*Math.PI/5)*r)}ctx.closePath();ctx.fill();if(!toon){ctx.strokeStyle='#2b2b38';ctx.lineWidth=1.4;ctx.stroke()}ctx.restore();continue}
    const s=p.s*(0.5+a*0.5);
    if(toon){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,s,0,PI2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(p.x-s*0.3,p.y-s*0.3,s*0.4,0,PI2);ctx.fill()}
    else{ctx.fillStyle=p.col;ctx.fillRect(p.x-s,p.y-s,s*2,s*2);ctx.strokeStyle='#2b2b38';ctx.lineWidth=1;ctx.strokeRect(p.x-s,p.y-s,s*2,s*2)}
  }
  ctx.globalAlpha=1;
}
function drawBullets(){
  const toon=TH==='toon',ink='#2b2b38';
  for(const b of S.bullets){
    const ang=Math.atan2(b.vy,b.vx);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);
    if(b.kind==='pellet'){
      if(toon){ctx.globalCompositeOperation='lighter';ctx.drawImage(glow(b.col),-8,-8,16,16);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff2c0';ctx.beginPath();ctx.arc(0,0,2.4,0,PI2);ctx.fill()}
      else{ctx.fillStyle=b.col;ctx.strokeStyle=ink;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,3.2,0,PI2);ctx.fill();ctx.stroke()}
    }else if(b.kind==='spear'){
      if(toon){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.7;ctx.drawImage(glow('#fff2c0'),-30,-10,44,20);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
      ctx.strokeStyle=toon?'#8a5a2a':ink;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(2,0);ctx.stroke();
      ctx.fillStyle='#fff6e0';ctx.strokeStyle=toon?'#3a2412':ink;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(0,-5);ctx.lineTo(3,0);ctx.lineTo(0,5);ctx.closePath();ctx.fill();ctx.stroke();
    }else if(b.kind==='arrow'){
      ctx.strokeStyle=toon?'#e8d0a0':ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(6,0);ctx.stroke();
      ctx.fillStyle=b.col;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-20,-4);ctx.lineTo(-12,0);ctx.lineTo(-20,4);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(4,-3);ctx.lineTo(4,3);ctx.closePath();ctx.fill();
    }else if(b.kind==='ally'){
      if(toon){ctx.globalCompositeOperation='lighter';ctx.drawImage(glow(b.col),-14,-8,22,16);ctx.globalCompositeOperation='source-over'}
      ctx.strokeStyle=toon?'#d8f4ff':b.col;ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(3,0);ctx.stroke();
      if(!toon){ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.strokeRect(-14,-1.8,17,3.6)}
    }else if(toon){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.8;ctx.drawImage(glow(b.col),-14,-10,24,20);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      const g=ctx.createLinearGradient(-22,0,4,0);g.addColorStop(0,'rgba(255,180,60,0)');g.addColorStop(1,'rgba(255,230,160,0.9)');ctx.fillStyle=g;ctx.fillRect(-22,-1.6,24,3.2);
      ctx.fillStyle='#fff6d0';ctx.beginPath();ctx.ellipse(0,0,5,2.6,0,0,PI2);ctx.fill()}
    else{ctx.strokeStyle=ink;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-16,-3);ctx.lineTo(-8,-3);ctx.moveTo(-18,3);ctx.lineTo(-9,3);ctx.stroke();
      ctx.fillStyle=b.col;ctx.beginPath();ctx.ellipse(0,0,5.5,3.4,0,0,PI2);ctx.fill();ctx.stroke()}
    ctx.restore();
  }
}
function drawLobs(){
  const toon=TH==='toon',ink=INK();
  for(const l of S.lobs){
    if(l.x===undefined)continue;
    const gy=lerp(l.y0,l.y1,l.k),sc=0.8+0.5*Math.sin(Math.PI*l.k);
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(l.x,gy,6,2.2,0,0,PI2);ctx.fill();
    ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.t*12);ctx.scale(sc,sc);ctx.strokeStyle=ink;ctx.lineWidth=1.8;
    if(l.kind==='gren'){ctx.fillStyle='#4a3020';ctx.beginPath();ctx.arc(0,0,7,0,PI2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffb43a';ctx.beginPath();ctx.arc(0,0,4.2,0,PI2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-1.5,-1.5,1.3,0,PI2);ctx.fill()}
    else if(l.kind==='dyn'){ctx.fillStyle='#d8302a';rr(-8,-3.5,16,7,2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(9,-4,2.5+Math.random()*1.5,0,PI2);ctx.fill()}
    else{ctx.strokeStyle=toon?'#e8d8b0':'#8a4ad8';ctx.lineWidth=1.4;const r=6+l.k*8;ctx.beginPath();ctx.arc(0,0,r,0,PI2);for(let i=0;i<4;i++){const a=i*Math.PI/4;ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(-Math.cos(a)*r,-Math.sin(a)*r)}ctx.stroke()}
    ctx.restore();
    if(toon&&l.kind!=='net'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;ctx.drawImage(glow('#ff8a2a'),l.x-10,l.y-10,20,20);ctx.restore()}
  }
  for(const s of S.spits){
    if(s.x===undefined)continue;
    if(TH==='toon'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.drawImage(glow('#7aff4a'),s.x-14,s.y-14,28,28);ctx.restore()}
    ctx.fillStyle='#7ae84a';ctx.strokeStyle=INK();ctx.lineWidth=1.8;ctx.beginPath();ctx.ellipse(s.x,s.y,6,5,0,0,PI2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#d8ffb0';ctx.beginPath();ctx.arc(s.x-2,s.y-2,1.6,0,PI2);ctx.fill();
  }
}
function drawCoins(){
  for(const c of S.coinFx){
    if(c.t<0)continue;const k=c.t/c.T,e=k*k,x=lerp(c.x0,c.x1,e)+c.vx*0.35*Math.sin(Math.PI*k),y=lerp(c.y0,c.y1,e)+c.vy*0.35*Math.sin(Math.PI*k);
    ctx.fillStyle='#ffc23a';ctx.strokeStyle=TH==='toon'?'#6a4400':'#2b2b38';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,y,4.5*Math.abs(Math.cos(c.t*12))+1,4.5,0,0,PI2);ctx.fill();ctx.stroke();
  }
}
/* 远景动态：火山烟、翼龙群 */
function drawAmbient(){
  const toon=TH==='toon';
  for(const m of S.smoke){const k=m.t/m.l,r=m.s*(1+k*2.2);
    ctx.fillStyle=toon?(S.stage>=2?'rgba(70,50,60,'+(0.5*(1-k))+')':'rgba(220,210,220,'+(0.5*(1-k))+')'):'rgba(255,255,255,'+(0.8*(1-k))+')';
    ctx.beginPath();ctx.arc(m.x,m.y,r,0,PI2);ctx.fill();if(!toon){ctx.strokeStyle='rgba(43,43,56,'+(0.6*(1-k))+')';ctx.lineWidth=1.4;ctx.stroke()}}
  ctx.strokeStyle=toon?(S.stage>=3?'rgba(20,10,30,0.7)':'rgba(50,30,40,0.6)'):'#2b2b38';ctx.lineWidth=1.6;ctx.lineCap='round';
  for(const f of S.flocks)for(let i=0;i<f.n;i++){const x=f.x-f.d*(i%2?1:0.4)*i*10,y=f.y+(i%2?6:-4)*Math.ceil(i/2)*0.6,w=Math.sin(f.t*8+i)*3;
    ctx.beginPath();ctx.moveTo(x-6,y-2-w);ctx.lineTo(x,y);ctx.lineTo(x+6,y-2-w);ctx.stroke()}
}
function drawTexts(){
  for(const t of S.texts){
    const a=Math.min(1,(1.1-t.t)*2.2),y=t.y-t.t*42,sc=t.t<0.12?0.6+t.t/0.12*0.5:1.1-Math.min(0.1,(t.t-0.12));
    ctx.save();ctx.globalAlpha=a;ctx.translate(t.x,y);ctx.scale(sc,sc);
    ctx.font='900 '+t.size+'px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.lineWidth=TH==='toon'?5:4.5;ctx.strokeStyle=TH==='toon'?'#2a1406':'#ffffff';ctx.strokeText(t.s,0,0);
    ctx.fillStyle=TH==='toon'?t.col:shade(t.col,-0.25);ctx.fillText(t.s,0,0);
    if(TH!=='toon'){ctx.lineWidth=1.2;ctx.strokeStyle='#2b2b38';ctx.strokeText(t.s,0,0)}
    ctx.restore();
  }
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sh=S.shake*14;ctx.save();if(sh>0)ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);
  const f=S.stageFade;
  if(f<1){ctx.drawImage(bgFor(S.prevStage),0,0,W,H);ctx.globalAlpha=f}
  ctx.drawImage(bgFor(S.stage),0,0,W,H);ctx.globalAlpha=1;
  drawAmbient();
  drawSceneFX(S.t);
  drawTele();
  const es=S.enemies.slice().sort((a,b)=>b.z-a.z);
  for(const e of es)drawShadow(e);
  for(const e of es)drawEnemy(e);
  drawFence();
  drawAllies();
  drawBullets();drawLobs();drawParts();
  drawTurret();drawAim();drawTexts();drawCoins();
  ctx.restore();
  if(S.flash>0){ctx.fillStyle='rgba(255,40,40,'+(S.flash*0.3)+')';ctx.fillRect(0,0,W,H)}
  if(S.combo>=20&&!S.dead){const v=ctx.createRadialGradient(cx,H/2,Math.min(W,H)*0.35,cx,H/2,Math.max(W,H)*0.72);v.addColorStop(0,'rgba(255,140,0,0)');v.addColorStop(1,'rgba(255,150,20,'+(0.16+0.08*Math.sin(S.t*10))+')');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
  if(S.hp<=4&&!S.dead){const v=ctx.createRadialGradient(cx,H/2,Math.min(W,H)*0.3,cx,H/2,Math.max(W,H)*0.7);v.addColorStop(0,'rgba(255,0,0,0)');v.addColorStop(1,'rgba(220,20,20,'+(0.2+0.12*Math.sin(S.t*6))+')');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
}

/* ================= 主循环 ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const ts=window.__ts||1;if(!paused)for(let i=0;i<ts;i++)update(dt);render();if(!paused)musicTick();
  requestAnimationFrame(frame);
}
K=newKit();
layout();applyLang();buildSprites();setMute(AU.muted);newGame();
requestAnimationFrame(frame);
// 测试钩子
window.__FT={setLang,setPause,get paused(){return paused},get S(){return S},get K(){return K},waveDef,stageOf,TYPES,WEAPONS,ALLIES,get AU(){return AU},
  skip(n){if(S.shop){S.shop=false;AU.calm=false;$('shop').classList.remove('show')}S.enemies=[];S.tele=[];S.spits=[];S.lobs=[];startWave(n)},
  spawn,openShop,closeShop,buyCard,autoShop,setDex,get seen(){return seen},renderBar,get offers(){return offers},fence(d){fenceDmg(d,cx,'raptor')}};

})();
